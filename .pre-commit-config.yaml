# Pre-commit hooks for stampbot
# Install: make pre-commit-install
# Run manually: make pre-commit
# See https://pre-commit.com for more information

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
        exclude: ^charts/.*templates/  # Exclude Helm templates (contain Go templates)
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-ast
      - id: check-case-conflict
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'develop']

  # Export Poetry dependencies to requirements.txt for Docker build caching
  # This keeps requirements.txt in sync with pyproject.toml automatically.
  # requirements.txt is used in Dockerfile to enable layer caching - changes to
  # pyproject.toml tool config won't invalidate the dependency layer.
  - repo: https://github.com/python-poetry/poetry-plugin-export
    rev: 1.10.0
    hooks:
      - id: poetry-export
        args: ["-f", "requirements.txt", "-o", "requirements.txt", "--only", "main"]

  # Conventional commit message validation
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.24.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  # Secret detection (supports pragma: allowlist secret for false positives)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # Ruff - fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      # Run formatter first
      - id: ruff-format
        args: [--check]
        types_or: [python, pyi]
      # Then run linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]

  # MyPy - static type checking (uses project venv; skipped in pre-commit.ci, runs in CI workflow)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        args: [--config-file=pyproject.toml, stampbot/]
        language: system
        pass_filenames: false
        files: ^stampbot/
        types: [python]

  # Renovate config validation
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 43.48.2
    hooks:
      - id: renovate-config-validator

  # Helm chart linting (if helm is installed)
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: helmlint
        files: ^charts/

  # Helm template validation with kubeconform
  - repo: local
    hooks:
      - id: helm-kubeconform
        name: Validate Helm templates with kubeconform
        entry: bash -c 'helm template test charts/stampbot --set github.appId=123456 --set github.privateKey=test --set github.webhookSecret=test | kubeconform -strict -ignore-missing-schemas -summary'
        language: system
        files: ^charts/
        pass_filenames: false

# Skip hooks on specific files
ci:
  skip: [helmlint, helm-kubeconform, commitlint, renovate-config-validator, mypy, poetry-export]  # Skip in CI (handled by workflows, too large, or requires local tools)
