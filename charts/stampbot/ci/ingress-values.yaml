# CI test values: ingress enabled
# Verifies the chart installs cleanly with an Ingress object. A real ingress
# controller is out of scope for this matrix — we assert the chart renders and
# installs and that the pod becomes Ready (and passes `helm test`).

replicaCount: 1

# Use locally built image in kind cluster
image:
  repository: stampbot
  tag: ci-test
  pullPolicy: Never

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

# Use existing secret (created by CI)
github:
  existingSecret: stampbot-github

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: stampbot.ci.local
      paths:
        - path: /
          pathType: Prefix
