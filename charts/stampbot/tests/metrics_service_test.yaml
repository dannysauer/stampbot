suite: Metrics Service tests
templates:
  - metrics-service.yaml
values:
  - ../values.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should expose only the dedicated metrics port when enabled
    set:
      metrics.enabled: true
      metrics.port: 9100
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stampbot-metrics
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: metrics
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].name
          value: metrics
      - equal:
          path: spec.ports[0].port
          value: 9100
      - equal:
          path: spec.ports[0].targetPort
          value: metrics

  - it: should apply metrics Service annotations
    set:
      metrics.enabled: true
      metrics.service.annotations:
        example.com/owner: monitoring
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: monitoring
