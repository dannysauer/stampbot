suite: Secret tests
templates:
  - secret.yaml
values:
  - ../values.yaml
tests:
  - it: should render secret with inline credentials
    set:
      github.appId: "123456"
      github.privateKey: "test-private-key"
      github.webhookSecret: "test-webhook-secret"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stampbot
      - equal:
          path: type
          value: Opaque

  - it: should set GitHub credentials in stringData
    set:
      github.appId: "123456"
      github.privateKey: "test-private-key"
      github.webhookSecret: "test-webhook-secret"
    asserts:
      - equal:
          path: stringData.STAMPBOT_APP_ID
          value: "123456"
      - equal:
          path: stringData.STAMPBOT_PRIVATE_KEY
          value: "test-private-key"
      - equal:
          path: stringData.STAMPBOT_WEBHOOK_SECRET
          value: "test-webhook-secret"

  - it: should not render when existingSecret is set
    set:
      github.existingSecret: "my-external-secret"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when externalSecrets is enabled
    set:
      externalSecrets.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should have standard labels
    set:
      github.appId: "123456"
      github.privateKey: "test-private-key"
      github.webhookSecret: "test-webhook-secret"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: stampbot
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
