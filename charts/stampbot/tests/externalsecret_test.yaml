suite: ExternalSecret tests
templates:
  - externalsecret.yaml
values:
  - ../values.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when externalSecrets is enabled
    set:
      externalSecrets.enabled: true
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stampbot-external

  - it: should reference correct secret store
    set:
      externalSecrets.enabled: true
      externalSecrets.secretStore.name: aws-secrets-manager
      externalSecrets.secretStore.kind: SecretStore
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: aws-secrets-manager
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore

  - it: should set refresh interval
    set:
      externalSecrets.enabled: true
      externalSecrets.refreshInterval: 30m
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 30m

  - it: should configure target secret
    set:
      externalSecrets.enabled: true
    asserts:
      - equal:
          path: spec.target.name
          value: RELEASE-NAME-stampbot-external
      - equal:
          path: spec.target.creationPolicy
          value: Owner

  - it: should map secret data correctly
    set:
      externalSecrets.enabled: true
      externalSecrets.data:
        - secretKey: STAMPBOT_APP_ID
          remoteRef:
            key: stampbot/github-credentials
            property: app_id
        - secretKey: STAMPBOT_PRIVATE_KEY
          remoteRef:
            key: stampbot/github-credentials
            property: private_key
    asserts:
      - equal:
          path: spec.data[0].secretKey
          value: STAMPBOT_APP_ID
      - equal:
          path: spec.data[0].remoteRef.key
          value: stampbot/github-credentials
      - equal:
          path: spec.data[0].remoteRef.property
          value: app_id
      - equal:
          path: spec.data[1].secretKey
          value: STAMPBOT_PRIVATE_KEY

  - it: should have standard labels
    set:
      externalSecrets.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: stampbot
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
