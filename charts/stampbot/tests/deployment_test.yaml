suite: Deployment tests
templates:
  - deployment.yaml
  - configmap.yaml
  - secret.yaml
values:
  - ../values.yaml
set:
  github.appId: "123456"
  github.privateKey: "test-key"
  github.webhookSecret: "test-secret"
tests:
  - it: should render deployment with default values
    template: deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stampbot
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/dannysauer/stampbot:0.0.0-placeholder"
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: should set correct replica count when autoscaling disabled
    template: deployment.yaml
    set:
      autoscaling.enabled: false
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should allow an explicit workload service account token mount
    template: deployment.yaml
    set:
      serviceAccount.automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: should not set replicas when autoscaling enabled
    template: deployment.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - isNull:
          path: spec.replicas

  - it: should use custom image tag
    template: deployment.yaml
    set:
      image.tag: "v1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/dannysauer/stampbot:v1.2.3"

  - it: should prefer image digest when specified
    template: deployment.yaml
    set:
      image.tag: "v1.2.3"
      image.digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/dannysauer/stampbot@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

  - it: should set security context
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: should configure liveness and readiness probes
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  - it: should expose correct ports
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8000
            protocol: TCP

  - it: should set resource limits and requests
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi

  - it: should use existing secret when specified
    template: deployment.yaml
    set:
      github.existingSecret: "my-external-secret"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="STAMPBOT_APP_ID")].valueFrom.secretKeyRef.name
          value: my-external-secret

  - it: should set log level from config
    template: deployment.yaml
    set:
      config.logLevel: DEBUG
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STAMPBOT_LOG_LEVEL
            value: DEBUG

  - it: should set setup environment variables
    template: deployment.yaml
    set:
      setup.enabled: true
      setup.allowConfigured: true
      setup.baseUrl: "https://stampbot.example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STAMPBOT_SETUP_ALLOW_CONFIGURED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STAMPBOT_SETUP_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STAMPBOT_BASE_URL
            value: "https://stampbot.example.com"

  - it: should configure OTEL when enabled
    template: deployment.yaml
    set:
      config.otelEnabled: true
      config.otelEndpoint: "http://otel:4317"
      config.otelServiceName: "my-stampbot"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STAMPBOT_OTEL_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STAMPBOT_OTEL_ENDPOINT
            value: "http://otel:4317"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STAMPBOT_OTEL_INSECURE
            value: "false"

  - it: should opt in to plaintext OTLP explicitly
    template: deployment.yaml
    set:
      config.otelEnabled: true
      config.otelEndpoint: "http://otel:4317"
      config.otelInsecure: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STAMPBOT_OTEL_INSECURE
            value: "true"

  - it: should mount a private OTLP CA from an existing secret
    template: deployment.yaml
    set:
      config.otelEnabled: true
      config.otelEndpoint: "https://otel:4317"
      config.otelCertificate.secretName: "otel-ca" # pragma: allowlist secret
      config.otelCertificate.secretKey: "collector-ca.pem" # pragma: allowlist secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_CERTIFICATE
            value: /var/run/stampbot/otel/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: otel-ca
            mountPath: /var/run/stampbot/otel
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-ca
            secret:
              secretName: otel-ca # pragma: allowlist secret
              items:
                - key: collector-ca.pem
                  path: ca.crt

  - it: should include prometheus scrape annotations
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "8000"

  - it: should apply deployment annotations when specified
    template: deployment.yaml
    set:
      deploymentAnnotations:
        argocd.argoproj.io/sync-wave: "5"
        reloader.stakater.com/auto: "true"
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "5"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: should not include deployment annotations when empty
    template: deployment.yaml
    asserts:
      - notExists:
          path: metadata.annotations

  - it: should mount tmp volume for read-only filesystem
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir:
              sizeLimit: 64Mi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: should configure the tmp volume size limit
    template: deployment.yaml
    set:
      tmp.sizeLimit: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name=="tmp")].emptyDir.sizeLimit
          value: 128Mi

  - it: should apply node selector when specified
    template: deployment.yaml
    set:
      nodeSelector:
        kubernetes.io/os: linux
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/os"]
          value: linux

  - it: should apply tolerations when specified
    template: deployment.yaml
    set:
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "stampbot"
          effect: "NoSchedule"
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: "dedicated"
            operator: "Equal"
            value: "stampbot"
            effect: "NoSchedule"
