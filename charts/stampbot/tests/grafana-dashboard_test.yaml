suite: Grafana Dashboard tests
templates:
  - grafana-dashboard.yaml
values:
  - ../values.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when grafanaDashboard is enabled
    set:
      grafanaDashboard.enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stampbot-grafana-dashboard

  - it: should have grafana sidecar discovery label
    set:
      grafanaDashboard.enabled: true
    asserts:
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"

  - it: should include custom labels
    set:
      grafanaDashboard.enabled: true
      grafanaDashboard.labels:
        custom-label: custom-value
    asserts:
      - equal:
          path: metadata.labels.custom-label
          value: custom-value

  - it: should include annotations when specified
    set:
      grafanaDashboard.enabled: true
      grafanaDashboard.annotations:
        grafana-folder: "Stampbot"
    asserts:
      - equal:
          path: metadata.annotations.grafana-folder
          value: "Stampbot"

  - it: should contain dashboard JSON
    set:
      grafanaDashboard.enabled: true
    asserts:
      - exists:
          path: data["stampbot-dashboard.json"]

  - it: should have standard labels
    set:
      grafanaDashboard.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: stampbot
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
