suite: Service tests
templates:
  - service.yaml
values:
  - ../values.yaml
tests:
  - it: should render service with default values
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stampbot
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should expose HTTP port on 80
    asserts:
      - contains:
          path: spec.ports
          content:
            port: 80
            targetPort: http
            protocol: TCP
            name: http

  - it: should only expose the HTTP port
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 1
      - notContains:
          path: spec.ports
          content:
            name: metrics

  - it: should have correct selector labels
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: stampbot
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should allow custom service type
    set:
      service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: should apply service annotations when specified
    set:
      service.annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: nlb
    asserts:
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
          value: nlb

  - it: should have standard labels
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: stampbot
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
