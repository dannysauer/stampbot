suite: NetworkPolicy tests
templates:
  - networkpolicy.yaml
values:
  - ../values.yaml
tests:
  - it: should not render NetworkPolicy by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render NetworkPolicy when enabled
    set:
      networkPolicy.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stampbot

  - it: should set policy types
    set:
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: should restrict ingress to named workload sources
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: stampbot
              ports:
                - protocol: TCP
                  port: 8000
                - protocol: TCP
                  port: metrics
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: ingress-nginx
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: ingress-nginx
              ports:
                - protocol: TCP
                  port: 8000
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus
              ports:
                - protocol: TCP
                  port: metrics

  - it: should restrict egress to DNS, HTTPS, and the local OTLP collector
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.egress
          value:
            - to:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: stampbot
              ports:
                - protocol: TCP
                  port: 8000
                - protocol: TCP
                  port: metrics
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - protocol: TCP
                  port: 53
                - protocol: UDP
                  port: 53
            - ports:
                - protocol: TCP
                  port: 443
            - to:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: opentelemetry-collector
              ports:
                - protocol: TCP
                  port: 4317

  - it: should have correct pod selector
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: stampbot
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should keep the policy on the named metrics port when its number changes
    set:
      networkPolicy.enabled: true
      metrics.enabled: true
      metrics.port: 9100
    asserts:
      - equal:
          path: spec.ingress[0].ports[1].port
          value: metrics
      - equal:
          path: spec.ingress[2].ports[0].port
          value: metrics
      - equal:
          path: spec.egress[0].ports[1].port
          value: metrics
