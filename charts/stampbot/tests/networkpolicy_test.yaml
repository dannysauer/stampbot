suite: NetworkPolicy tests
templates:
  - networkpolicy.yaml
values:
  - ../values.yaml
tests:
  - it: should not render NetworkPolicy by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render NetworkPolicy when enabled
    set:
      networkPolicy.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stampbot

  - it: should set policy types
    set:
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: should allow egress to DNS and GitHub API
    set:
      networkPolicy.enabled: true
    asserts:
      - exists:
          path: spec.egress

  - it: should have correct pod selector
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: stampbot
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
