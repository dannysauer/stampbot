suite: Helm test connection hook
templates:
  - tests/test-connection.yaml
values:
  - ../values.yaml
tests:
  - it: renders a test Pod with the helm test hook annotations
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stampbot-test-connection
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: spec.restartPolicy
          value: Never
      - equal:
          path: spec.automountServiceAccountToken
          value: false

  - it: targets the public in-cluster service and core endpoints
    asserts:
      - matchRegex:
          path: spec.containers[0].args[0]
          pattern: "RELEASE-NAME-stampbot\\..*\\.svc:80"
      - matchRegex:
          path: spec.containers[0].args[0]
          pattern: "/health"
      - matchRegex:
          path: spec.containers[0].args[0]
          pattern: "/ready"
      - notMatchRegex:
          path: spec.containers[0].args[0]
          pattern: "/metrics"

  - it: checks the internal metrics service when metrics are enabled
    set:
      metrics.enabled: true
      metrics.port: 9100
    asserts:
      - matchRegex:
          path: spec.containers[0].args[0]
          pattern: "RELEASE-NAME-stampbot-metrics\\..*\\.svc:9100"
      - matchRegex:
          path: spec.containers[0].args[0]
          pattern: "/metrics"

  - it: reuses the application image
    asserts:
      - matchRegex:
          path: spec.containers[0].image
          pattern: "ghcr.io/dannysauer/stampbot:"
