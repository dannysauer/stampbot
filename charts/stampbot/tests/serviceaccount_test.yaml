suite: ServiceAccount tests
templates:
  - serviceaccount.yaml
values:
  - ../values.yaml
tests:
  - it: should render service account with default values
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stampbot

  - it: should not render service account when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should apply annotations when specified
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/stampbot
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789:role/stampbot

  - it: should use custom name when specified
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: should have standard labels
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: stampbot
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
