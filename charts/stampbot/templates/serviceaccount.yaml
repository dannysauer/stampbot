{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stampbot.serviceAccountName" . }}
  labels:
    {{- include "stampbot.labels" . | nindent 4 }}
  {{- $serviceAccountAnnotations := .Values.serviceAccount.annotations }}
  {{- if .Values.awsSecretsManager.enabled }}
  {{- $serviceAccountAnnotations = omit .Values.serviceAccount.annotations "eks.amazonaws.com/role-arn" }}
  {{- end }}
  {{- if or $serviceAccountAnnotations .Values.awsSecretsManager.enabled }}
  annotations:
    {{- with $serviceAccountAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.awsSecretsManager.enabled }}
    eks.amazonaws.com/role-arn: {{ required "awsSecretsManager.roleArn is required when awsSecretsManager.enabled=true" .Values.awsSecretsManager.roleArn | quote }}
    {{- end }}
  {{- end }}
{{- end }}
