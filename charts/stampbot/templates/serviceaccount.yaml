{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stampbot.serviceAccountName" . }}
  labels:
    {{- include "stampbot.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.awsSecretsManager.enabled }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.awsSecretsManager.roleArn }}
  {{- end }}
{{- end }}
