apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stampbot.fullname" . }}
  labels:
    {{- include "stampbot.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stampbot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "stampbot.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stampbot.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ include "stampbot.image" . }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
          protocol: TCP
        {{- end }}
        env:
        - name: STAMPBOT_HOST
          value: "0.0.0.0"
        - name: STAMPBOT_PORT
          value: "8000"
        - name: STAMPBOT_SETUP_ENABLED
          value: {{ .Values.setup.enabled | quote }}
        - name: STAMPBOT_SETUP_ALLOW_CONFIGURED
          value: {{ .Values.setup.allowConfigured | quote }}
        - name: STAMPBOT_METRICS_ENABLED
          value: {{ .Values.metrics.enabled | quote }}
        {{- if .Values.metrics.enabled }}
        - name: STAMPBOT_METRICS_HOST
          value: "0.0.0.0"
        - name: STAMPBOT_METRICS_PORT
          value: {{ .Values.metrics.port | quote }}
        {{- end }}
        {{- if .Values.setup.baseUrl }}
        - name: STAMPBOT_BASE_URL
          value: {{ .Values.setup.baseUrl | quote }}
        {{- end }}
        - name: STAMPBOT_LOG_LEVEL
          value: {{ .Values.config.logLevel }}
        - name: STAMPBOT_REPO_CONFIG_CACHE_SECONDS
          value: {{ .Values.config.repoConfigCacheSeconds | quote }}
        - name: STAMPBOT_OTEL_ENABLED
          value: {{ .Values.config.otelEnabled | quote }}
        {{- if .Values.config.otelEnabled }}
        - name: STAMPBOT_OTEL_ENDPOINT
          value: {{ .Values.config.otelEndpoint }}
        - name: STAMPBOT_OTEL_SERVICE_NAME
          value: {{ .Values.config.otelServiceName }}
        - name: STAMPBOT_OTEL_INSECURE
          value: {{ .Values.config.otelInsecure | quote }}
        {{- if .Values.config.otelCertificate.secretName }}
        - name: OTEL_EXPORTER_OTLP_CERTIFICATE
          value: /var/run/stampbot/otel/ca.crt
        {{- end }}
        {{- end }}
        - name: STAMPBOT_APP_ID
          valueFrom:
            secretKeyRef:
              name: {{ if .Values.github.existingSecret }}{{ .Values.github.existingSecret }}{{ else if .Values.externalSecrets.enabled }}{{ include "stampbot.fullname" . }}-external{{ else }}{{ include "stampbot.fullname" . }}{{ end }}
              key: STAMPBOT_APP_ID
        - name: STAMPBOT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: {{ if .Values.github.existingSecret }}{{ .Values.github.existingSecret }}{{ else if .Values.externalSecrets.enabled }}{{ include "stampbot.fullname" . }}-external{{ else }}{{ include "stampbot.fullname" . }}{{ end }}
              key: STAMPBOT_PRIVATE_KEY
        - name: STAMPBOT_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ if .Values.github.existingSecret }}{{ .Values.github.existingSecret }}{{ else if .Values.externalSecrets.enabled }}{{ include "stampbot.fullname" . }}-external{{ else }}{{ include "stampbot.fullname" . }}{{ end }}
              key: STAMPBOT_WEBHOOK_SECRET
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if and .Values.config.otelEnabled .Values.config.otelCertificate.secretName }}
        - name: otel-ca
          mountPath: /var/run/stampbot/otel
          readOnly: true
        {{- end }}
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: {{ .Values.tmp.sizeLimit | quote }}
      {{- if and .Values.config.otelEnabled .Values.config.otelCertificate.secretName }}
      - name: otel-ca
        secret:
          secretName: {{ .Values.config.otelCertificate.secretName | quote }}
          items:
          - key: {{ .Values.config.otelCertificate.secretKey | quote }}
            path: ca.crt
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
