# Default values for the Stampbot Helm chart.
# See https://github.com/dannysauer/stampbot/tree/main/charts/stampbot for the full guide.

# replicaCount -- Number of Pods when autoscaling.enabled is false.
# @schema
# type: integer
# minimum: 1
# @schema
replicaCount: 2

# image -- Stampbot container image.
# @schema
# type: object
# properties:
#   repository:
#     type: string
#   pullPolicy:
#     type: string
#     enum: [Always, IfNotPresent, Never]
#   tag:
#     type: string
# @schema
image:
  # image.repository -- Container registry and repository.
  repository: ghcr.io/dannysauer/stampbot
  # image.pullPolicy -- Kubernetes image pull policy.
  pullPolicy: IfNotPresent
  # image.tag -- Container tag. An empty value uses the chart appVersion.
  tag: ""
  # image.digest -- Optional sha256 digest. A digest takes precedence over image.tag.
  digest: ""

# imagePullSecrets -- Secret references used to pull the container image.
# @schema
# type: array
# items:
#   type: object
# @schema
imagePullSecrets: []

# nameOverride -- Override the chart name portion of generated resource names.
# @schema
# type: string
# @schema
nameOverride: ""

# fullnameOverride -- Replace the generated resource fullname.
# @schema
# type: string
# @schema
fullnameOverride: ""

# serviceAccount -- Workload ServiceAccount settings.
serviceAccount:
  # serviceAccount.create -- Create a ServiceAccount for Stampbot.
  create: true
  # serviceAccount.annotations -- Annotations added to the ServiceAccount.
  annotations: {}
  # serviceAccount.name -- Existing or explicit ServiceAccount name.
  name: ""

# deploymentAnnotations -- Annotations added to the Deployment object.
deploymentAnnotations: {}

# podAnnotations -- Annotations added to the Pod template.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

# podSecurityContext -- Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# securityContext -- Stampbot container security context.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# service -- Kubernetes Service settings.
service:
  # service.type -- Kubernetes Service type.
  type: ClusterIP
  # service.port -- Port exposed by the Service.
  port: 80
  # service.targetPort -- Stampbot container port.
  targetPort: 8000
  # service.annotations -- Annotations added to the Service.
  annotations: {}

# metrics -- Prometheus discovery settings. Stampbot always serves /metrics.
metrics:
  # metrics.enabled -- Permit ServiceMonitor creation; this does not disable the endpoint.
  enabled: true
  # metrics.serviceMonitor -- Prometheus Operator ServiceMonitor settings.
  serviceMonitor:
    # metrics.serviceMonitor.enabled -- Create a ServiceMonitor.
    enabled: false
    # metrics.serviceMonitor.interval -- Prometheus scrape interval.
    interval: 30s
    # metrics.serviceMonitor.scrapeTimeout -- Per-scrape timeout.
    scrapeTimeout: 10s

# ingress -- Kubernetes Ingress settings.
ingress:
  # ingress.enabled -- Create an Ingress.
  enabled: false
  # ingress.className -- Ingress controller class.
  className: ""
  # ingress.annotations -- Annotations added to the Ingress.
  annotations: {}
  # ingress.hosts -- Host and path rules.
  hosts:
    - host: stampbot.local
      paths:
        - path: /
          pathType: Prefix
  # ingress.tls -- TLS entries for the Ingress.
  tls: []

# resources -- Stampbot container requests and limits.
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# autoscaling -- Horizontal Pod Autoscaler settings.
autoscaling:
  # autoscaling.enabled -- Create an HPA. The HPA ignores replicaCount.
  enabled: true
  # autoscaling.minReplicas -- Minimum HPA replica count.
  minReplicas: 2
  # autoscaling.maxReplicas -- Maximum HPA replica count.
  maxReplicas: 10
  # autoscaling.targetCPUUtilizationPercentage -- Average CPU utilization target.
  targetCPUUtilizationPercentage: 80
  # autoscaling.customMetrics -- Raw autoscaling/v2 custom metric settings.
  customMetrics:
    # autoscaling.customMetrics.enabled -- Add the custom metric list to the HPA.
    enabled: false
    # autoscaling.customMetrics.metrics -- Raw autoscaling/v2 metric specifications.
    metrics:
      - type: Pods
        pods:
          metric:
            name: stampbot_http_requests_total
          target:
            type: AverageValue
            averageValue: "100"

# vpa -- Vertical Pod Autoscaler settings.
vpa:
  # vpa.enabled -- Create a VerticalPodAutoscaler.
  enabled: false
  # vpa.updateMode -- VPA mode: Off, Initial, Recreate, or Auto.
  updateMode: "Auto"
  # vpa.minAllowed -- Minimum CPU and memory recommendation.
  minAllowed:
    cpu: 50m
    memory: 64Mi
  # vpa.maxAllowed -- Maximum CPU and memory recommendation.
  maxAllowed:
    cpu: 1000m
    memory: 1Gi

# nodeSelector -- Node labels required by Stampbot Pods.
nodeSelector: {}

# tolerations -- Tolerations added to Stampbot Pods.
tolerations: []

# affinity -- Affinity and anti-affinity rules for Stampbot Pods.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - stampbot
          topologyKey: kubernetes.io/hostname

# config -- Stampbot process settings injected into the Deployment.
config:
  # config.logLevel -- STAMPBOT_LOG_LEVEL.
  logLevel: INFO
  # config.otelEnabled -- STAMPBOT_OTEL_ENABLED.
  otelEnabled: false
  # config.otelEndpoint -- STAMPBOT_OTEL_ENDPOINT when tracing is enabled.
  otelEndpoint: ""
  # config.otelServiceName -- STAMPBOT_OTEL_SERVICE_NAME.
  otelServiceName: stampbot

# setup -- GitHub App setup-flow settings.
setup:
  # setup.enabled -- Enable /setup. Keep this false after provisioning.
  enabled: false
  # setup.baseUrl -- Public Stampbot origin used for callback and webhook URLs.
  baseUrl: ""

# github -- GitHub App credential source.
github:
  # github.appId -- Inline App ID. Prefer github.existingSecret in production.
  appId: ""
  # github.privateKey -- Inline PEM private key. Prefer github.existingSecret in production.
  privateKey: ""
  # github.webhookSecret -- Inline webhook secret. Prefer github.existingSecret in production.
  webhookSecret: ""
  # github.existingSecret -- Secret with STAMPBOT_APP_ID, STAMPBOT_PRIVATE_KEY, and STAMPBOT_WEBHOOK_SECRET.
  existingSecret: ""

# awsSecretsManager -- IRSA annotation settings for a Helm-created ServiceAccount.
awsSecretsManager:
  # awsSecretsManager.enabled -- Add the IRSA role annotation.
  enabled: false
  # awsSecretsManager.secretName -- Reserved; current templates do not read this value.
  secretName: "stampbot/github-credentials"
  # awsSecretsManager.region -- Reserved; set the AWS region on the SecretStore.
  region: "us-east-1"
  # awsSecretsManager.roleArn -- IAM role ARN. Required when awsSecretsManager.enabled is true.
  roleArn: ""

# externalSecrets -- External Secrets Operator settings.
externalSecrets:
  # externalSecrets.enabled -- Create an ExternalSecret for Stampbot credentials.
  enabled: false
  # externalSecrets.secretStore -- Existing SecretStore or ClusterSecretStore reference.
  secretStore:
    # externalSecrets.secretStore.name -- Store resource name.
    name: aws-secrets-manager
    # externalSecrets.secretStore.kind -- SecretStore or ClusterSecretStore.
    kind: SecretStore
  # externalSecrets.refreshInterval -- ExternalSecret refresh interval.
  refreshInterval: 1h
  # externalSecrets.data -- Target Secret keys and their remote references.
  data:
    - secretKey: STAMPBOT_APP_ID
      remoteRef:
        key: stampbot/github-credentials
        property: app_id
    - secretKey: STAMPBOT_PRIVATE_KEY
      remoteRef:
        key: stampbot/github-credentials
        property: private_key
    - secretKey: STAMPBOT_WEBHOOK_SECRET
      remoteRef:
        key: stampbot/github-credentials
        property: webhook_secret

# opentelemetry -- Reserved values. Use config.otelEnabled, config.otelEndpoint, and config.otelServiceName.
opentelemetry:
  # opentelemetry.enabled -- Reserved; current templates do not read this value.
  enabled: false
  # opentelemetry.endpoint -- Reserved; current templates do not read this value.
  endpoint: "http://otel-collector:4317"
  # opentelemetry.serviceName -- Reserved; current templates do not read this value.
  serviceName: stampbot

# podDisruptionBudget -- PodDisruptionBudget settings.
podDisruptionBudget:
  # podDisruptionBudget.enabled -- Create a PodDisruptionBudget.
  enabled: true
  # podDisruptionBudget.minAvailable -- Minimum available Stampbot Pods.
  minAvailable: 1

# networkPolicy -- NetworkPolicy settings. Replace the example rules for your cluster.
networkPolicy:
  # networkPolicy.enabled -- Create a NetworkPolicy.
  enabled: false
  # networkPolicy.policyTypes -- Policy directions controlled by this resource.
  policyTypes:
    - Ingress
    - Egress
  # networkPolicy.ingress -- Raw networking.k8s.io/v1 ingress rules.
  ingress:
    - from:
      - namespaceSelector: {}
  # networkPolicy.egress -- Raw networking.k8s.io/v1 egress rules.
  egress:
    - to:
      - namespaceSelector: {}
    - to:
      - podSelector: {}
    - ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 53
      - protocol: UDP
        port: 53

# grafanaDashboard -- Bundled Grafana dashboard ConfigMap settings.
# @schema
# type: object
# properties:
#   enabled:
#     type: boolean
#   labels:
#     type: object
#   annotations:
#     type: object
# @schema
grafanaDashboard:
  # grafanaDashboard.enabled -- Create the dashboard ConfigMap.
  enabled: false
  # grafanaDashboard.labels -- Labels used by the Grafana sidecar to discover the dashboard.
  labels:
    grafana_dashboard: "1"
  # grafanaDashboard.annotations -- Annotations added to the dashboard ConfigMap.
  annotations: {}
