# Add this service to your existing Frigate docker-compose.yml.
# The watchdog needs access to the Docker socket so it can restart Frigate.
#
# Environment variables (all optional):
#   FRIGATE_URL        - URL of the Frigate API  (default: http://frigate:5000)
#   FRIGATE_CONTAINER  - Container name to restart (default: frigate)
#   CHECK_INTERVAL     - Seconds between polls    (default: 60)
#   STUCK_THRESHOLD    - Seconds of zero fps before restart (default: 300)

services:
  frigate-watchdog:
    build: ./watchdog          # or use: image: ghcr.io/dannysauer/frigate-watchdog:latest
    restart: unless-stopped
    environment:
      FRIGATE_URL: "http://frigate:5000"
      FRIGATE_CONTAINER: "frigate"   # must match the container_name of your Frigate service
      CHECK_INTERVAL: "60"
      STUCK_THRESHOLD: "300"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - frigate
    # Keep the watchdog out of Frigate's network namespace
    network_mode: "service:frigate"
