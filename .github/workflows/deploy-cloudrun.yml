name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g., 1.2.3). Defaults to latest release.'
        required: false
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: true
        type: string
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        description: 'Google Cloud Workload Identity provider resource name'
        required: true
      GCP_SERVICE_ACCOUNT:
        description: 'Google Cloud deployer service account'
        required: true

permissions:
  contents: read

# GCP Setup Requirements:
# 1. Create a GCP project and enable Cloud Run API
# 2. Create a service account with roles:
#    - roles/run.admin (Cloud Run Admin)
#    - roles/iam.serviceAccountUser (to act as the runtime service account)
# 3. Set up Workload Identity Federation:
#    - Create a Workload Identity Pool
#    - Create a Provider for GitHub Actions
#    - Grant the service account access to the pool
# 4. Set repository secrets:
#    - GCP_WORKLOAD_IDENTITY_PROVIDER: Workload Identity provider resource name
#    - GCP_SERVICE_ACCOUNT: Deployer service account identity
# 5. Set repository variables:
#    - GOOGLE_PUBLISHING_ENABLED: Set to 1 to allow deployment; every other value disables it
#    - CLOUDRUN_REGION: Region for Cloud Run (default: us-central1)
#    - CLOUDRUN_SERVICE_NAME: Service name (default: stampbot)

env:
  DOCKERHUB_IMAGE: stampbot/stampbot
  CLOUDRUN_REGION: ${{ vars.CLOUDRUN_REGION || 'us-central1' }}
  CLOUDRUN_SERVICE: ${{ vars.CLOUDRUN_SERVICE_NAME || 'stampbot' }}

jobs:
  deploy:
    name: Deploy to Cloud Run
    if: vars.GOOGLE_PUBLISHING_ENABLED == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Determine image tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            # Fetch latest release tag (excluding chart releases)
            LATEST=$(gh api repos/${{ github.repository }}/releases --jq '[.[] | select(.tag_name | startswith("v"))][0].tag_name')
            if [ -z "$LATEST" ]; then
              echo "::error::No releases found"
              exit 1
            fi
            echo "Using latest release: $LATEST"
            echo "tag=${LATEST#v}" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.CLOUDRUN_SERVICE }}
          region: ${{ env.CLOUDRUN_REGION }}
          image: docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.tag }}
          flags: '--port=8000 --allow-unauthenticated'
          # Cloud Run will use the service's existing configuration for env vars and secrets
          # Configure these in the GCP Console or via gcloud CLI

      - name: Show deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
