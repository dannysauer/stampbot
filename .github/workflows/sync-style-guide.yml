name: Sync Google Python Style Guide

on:
  schedule:
    # Run on the 1st of each month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:  # Allow manual trigger

permissions: read-all

jobs:
  sync-style-guide:
    name: Sync Style Guide
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Fetch latest style guide
        run: |
          curl -sSL "https://raw.githubusercontent.com/google/styleguide/gh-pages/pyguide.md" \
            -o docs/external/google-python-style-guide.md

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/external/google-python-style-guide.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in Google Python Style Guide"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in Google Python Style Guide"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update Google Python Style Guide"
          title: "docs: update Google Python Style Guide"
          body: |
            This PR updates the vendored Google Python Style Guide to the latest version.

            Source: https://github.com/google/styleguide/blob/gh-pages/pyguide.md

            This is an automated monthly sync. Please review the changes to ensure
            they don't conflict with our local overrides (e.g., 100-char line length).
          branch: chore/sync-style-guide
          delete-branch: true
          labels: |
            documentation
            automated
