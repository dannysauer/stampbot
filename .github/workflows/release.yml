name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0). Leave empty to auto-calculate.'
        required: false
        type: string

permissions: read-all

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ github.repository }}
  DOCKERHUB_IMAGE: stampbot/stampbot

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # If tag provided via workflow_dispatch, use it
          if [ -n "$INPUT_TAG" ]; then
            # Verify tag exists
            if ! git rev-parse "$INPUT_TAG" >/dev/null 2>&1; then
              echo "::error::Tag $INPUT_TAG does not exist"
              exit 1
            fi
            echo "version=${INPUT_TAG#v}" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Using provided tag: $INPUT_TAG"
            exit 0
          fi

          # Auto-calculate version from commits
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="$LATEST_TAG..HEAD"
          fi

          echo "Latest tag: $LATEST_TAG"
          echo "Analyzing commits: $COMMIT_RANGE"

          # Check for releasable commits (feat or fix)
          if ! git log "$COMMIT_RANGE" --pretty=format:"%s" 2>/dev/null | grep -qE "^(feat|fix)(\(.+\))?(!)?:"; then
            echo "No feat or fix commits since $LATEST_TAG - skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine bump type
          BUMP_TYPE="patch"
          if git log "$COMMIT_RANGE" --pretty=format:"%s%n%b" | grep -qE "(^[a-z]+(\(.+\))?!:|BREAKING CHANGE:)"; then
            BUMP_TYPE="major"
          elif git log "$COMMIT_RANGE" --pretty=format:"%s" | grep -qE "^feat(\(.+\))?:"; then
            BUMP_TYPE="minor"
          fi

          echo "Bump type: $BUMP_TYPE"

          # Calculate new version
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "$BUMP_TYPE" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "New version: v$NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: steps.version.outputs.should_release == 'true' && inputs.tag == ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

  build-and-publish-image:
    name: Build and Publish Docker Image
    needs: determine-version
    if: needs.determine-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # For keyless signing with cosign/Sigstore
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: stampbot
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate SBOM and push to OCI registry
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ needs.determine-version.outputs.version }}
          artifact-name: sbom-${{ needs.determine-version.outputs.version }}.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json
          upload-artifact: true
          upload-release-assets: false  # We handle this in the release step
          dependency-snapshot: true  # Upload to GitHub Dependency Graph

      - name: Attest SBOM to image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          cosign attest --predicate sbom.spdx.json \
            --type spdxjson \
            --yes \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}@${DIGEST}

      - name: Attest VEX to image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          cosign attest --predicate .openvex.json \
            --type openvex \
            --yes \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}@${DIGEST}

      - name: Copy VEX document for release
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: cp .openvex.json "stampbot-${VERSION}.vex.json"

      - name: Sign release artifacts
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          for artifact in sbom.spdx.json "stampbot-${VERSION}.vex.json"; do
            cosign sign-blob --yes \
              --bundle "${artifact}.sigstore.json" \
              "${artifact}"
          done

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -v "^v${VERSION}$" | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="${LATEST_TAG}..v${VERSION}"
          fi

          echo "Generating changelog for range: $COMMIT_RANGE"

          echo "## What's Changed" > app-changelog.md
          echo "" >> app-changelog.md

          FOUND_COMMITS=false
          for type in feat fix docs chore refactor test ci; do
            COMMITS=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --grep="^${type}:" --grep="^${type}(" -E 2>/dev/null || true)
            if [ -n "$COMMITS" ]; then
              FOUND_COMMITS=true
              case $type in
                feat) echo "### 🚀 Features" >> app-changelog.md ;;
                fix) echo "### 🐛 Bug Fixes" >> app-changelog.md ;;
                docs) echo "### 📚 Documentation" >> app-changelog.md ;;
                chore) echo "### 🔧 Maintenance" >> app-changelog.md ;;
                refactor) echo "### ♻️ Refactoring" >> app-changelog.md ;;
                test) echo "### 🧪 Tests" >> app-changelog.md ;;
                ci) echo "### 🏗️ CI/CD" >> app-changelog.md ;;
              esac
              echo "$COMMITS" >> app-changelog.md
              echo "" >> app-changelog.md
            fi
          done

          if [ "$FOUND_COMMITS" = false ]; then
            echo "- Various improvements and bug fixes" >> app-changelog.md
            echo "" >> app-changelog.md
          fi

          if [ -n "$LATEST_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...v${VERSION}" >> app-changelog.md
          fi

          cat app-changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ needs.determine-version.outputs.version }}
          name: "stampbot v${{ needs.determine-version.outputs.version }}"
          body_path: app-changelog.md
          files: |
            sbom.spdx.json
            sbom.spdx.json.sigstore.json
            stampbot-${{ needs.determine-version.outputs.version }}.vex.json
            stampbot-${{ needs.determine-version.outputs.version }}.vex.json.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-chart:
    name: Release Helm Chart
    needs: [determine-version, build-and-publish-image]
    if: needs.determine-version.outputs.should_release == 'true'
    uses: ./.github/workflows/chart-release.yml
    with:
      app_version: ${{ needs.determine-version.outputs.version }}
    permissions:
      contents: write
      id-token: write
      packages: write

  deploy-cloudrun:
    name: Deploy to Cloud Run
    needs: [determine-version, build-and-publish-image]
    if: needs.determine-version.outputs.should_release == 'true' && vars.GCP_SERVICE_ACCOUNT != ''
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      image_tag: ${{ needs.determine-version.outputs.version }}
    permissions:
      contents: read
      id-token: write
