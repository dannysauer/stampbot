name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing app tag to retry (must point at default-branch HEAD). Leave empty to auto-calculate.'
        required: false
        type: string

permissions: read-all

concurrency:
  # GitHub keeps at most one running and one pending member of a concurrency
  # group. A burst of pushes therefore coalesces behind the active publisher,
  # and the surviving run calculates from every commit after the latest tag.
  group: stampbot-app-release-${{ github.repository }}
  cancel-in-progress: false

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ github.repository }}
  DOCKERHUB_IMAGE: stampbot/stampbot

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
      should_release_chart: ${{ steps.version.outputs.should_release_chart }}
    steps:
      - name: Validate release ref
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          EXPECTED_REF="refs/heads/${DEFAULT_BRANCH}"
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "::error::Manual releases must run from $EXPECTED_REF"
            exit 1
          fi

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_ID }}
          private-key: ${{ secrets.AUTOMATION_SECRET }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          python .github/scripts/release_plan.py \
            --requested-tag "$INPUT_TAG" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate retry release state
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RETRY_TAG: ${{ inputs.tag }}
        run: |
          if RELEASE_DRAFT=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RETRY_TAG" \
            --jq '.draft' 2>&1); then
            if [ "$RELEASE_DRAFT" != "true" ]; then
              echo "::error::Release $RETRY_TAG is already published and cannot be retried"
              exit 1
            fi
          elif [[ "$RELEASE_DRAFT" != *"(HTTP 404)"* ]]; then
            echo "::error::Unable to verify release state for $RETRY_TAG"
            echo "$RELEASE_DRAFT"
            exit 1
          fi

      - name: Create and push tag
        if: steps.version.outputs.should_release == 'true' && inputs.tag == ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

  build-and-publish-image:
    name: Build and Publish Docker Image
    needs: determine-version
    if: needs.determine-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # For keyless signing with cosign/Sigstore
    outputs:
      release_asset_hashes: ${{ steps.provenance-subjects.outputs.hashes }}
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_ID }}
          private-key: ${{ secrets.AUTOMATION_SECRET }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: stampbot
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            STAMPBOT_VERSION=${{ needs.determine-version.outputs.version }}
          cache-from: type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate SBOM and push to OCI registry
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ needs.determine-version.outputs.version }}
          artifact-name: sbom-${{ needs.determine-version.outputs.version }}.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json
          upload-artifact: true
          upload-release-assets: false  # We handle this in the release step
          dependency-snapshot: true  # Upload to GitHub Dependency Graph

      - name: Attest SBOM to image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          cosign attest --predicate sbom.spdx.json \
            --type spdxjson \
            --yes \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}@${DIGEST}"

      - name: Attest VEX to image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          cosign attest --predicate .openvex.json \
            --type openvex \
            --yes \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}@${DIGEST}"

      - name: Copy VEX document for release
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: cp .openvex.json "stampbot-${VERSION}.vex.json"

      - name: Sign release artifacts
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          for artifact in sbom.spdx.json "stampbot-${VERSION}.vex.json"; do
            cosign sign-blob --yes \
              --bundle "${artifact}.sigstore.json" \
              "${artifact}"
          done

      - name: Generate SLSA provenance subjects
        id: provenance-subjects
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          echo "hashes=$(sha256sum sbom.spdx.json "stampbot-${VERSION}.vex.json" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -v "^v${VERSION}$" | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="refs/tags/${LATEST_TAG}..refs/tags/v${VERSION}"
          fi

          echo "Generating changelog for range: $COMMIT_RANGE"

          echo "## What's Changed" > app-changelog.md
          echo "" >> app-changelog.md

          FOUND_COMMITS=false
          for type in feat fix docs chore refactor test ci; do
            COMMITS=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --grep="^${type}:" --grep="^${type}(" -E 2>/dev/null || true)
            if [ -n "$COMMITS" ]; then
              FOUND_COMMITS=true
              case $type in
                feat) echo "### 🚀 Features" >> app-changelog.md ;;
                fix) echo "### 🐛 Bug Fixes" >> app-changelog.md ;;
                docs) echo "### 📚 Documentation" >> app-changelog.md ;;
                chore) echo "### 🔧 Maintenance" >> app-changelog.md ;;
                refactor) echo "### ♻️ Refactoring" >> app-changelog.md ;;
                test) echo "### 🧪 Tests" >> app-changelog.md ;;
                ci) echo "### 🏗️ CI/CD" >> app-changelog.md ;;
              esac
              echo "$COMMITS" >> app-changelog.md
              echo "" >> app-changelog.md
            fi
          done

          if [ "$FOUND_COMMITS" = false ]; then
            echo "- Various improvements and bug fixes" >> app-changelog.md
            echo "" >> app-changelog.md
          fi

          if [ -n "$LATEST_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...v${VERSION}" >> app-changelog.md
          fi

          cat app-changelog.md

      - name: Create draft GitHub Release
        id: create-release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: v${{ needs.determine-version.outputs.version }}
          name: "stampbot v${{ needs.determine-version.outputs.version }}"
          draft: true
          fail_on_unmatched_files: true
          body_path: app-changelog.md
          files: |
            sbom.spdx.json
            sbom.spdx.json.sigstore.json
            stampbot-${{ needs.determine-version.outputs.version }}.vex.json
            stampbot-${{ needs.determine-version.outputs.version }}.vex.json.sigstore.json
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  app-release-provenance:
    name: Generate App Release SLSA Provenance
    needs: [determine-version, build-and-publish-image]
    if: needs.determine-version.outputs.should_release == 'true'
    permissions:
      actions: read  # For reusable workflow path detection
      contents: read
      id-token: write  # For keyless SLSA provenance signing
    # SLSA generator workflows must use a full semantic tag for slsa-verifier compatibility.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build-and-publish-image.outputs.release_asset_hashes }}
      provenance-name: stampbot-${{ needs.determine-version.outputs.version }}.intoto.jsonl
      # A first-party job uploads this known Actions artifact to the exact
      # numeric draft created above. The generator must never discover a
      # release by tag because repositories with more than 100 releases can
      # otherwise split assets across same-tag drafts.
      upload-assets: false

  publish-app-release:
    name: Publish App Release
    needs: [determine-version, build-and-publish-image, app-release-provenance]
    if: needs.determine-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_ID }}
          private-key: ${{ secrets.AUTOMATION_SECRET }}

      - name: Checkout release finalizer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the known provenance artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stampbot-${{ needs.determine-version.outputs.version }}.intoto.jsonl
          path: release-provenance

      - name: Verify assets and publish the exact release ID
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ID: ${{ needs.build-and-publish-image.outputs.release_id }}
          RELEASE_UPLOAD_URL: ${{ needs.build-and-publish-image.outputs.release_upload_url }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          python .github/scripts/finalize_release.py \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --upload-url "$RELEASE_UPLOAD_URL" \
            --tag "v${VERSION}" \
            --provenance "release-provenance/stampbot-${VERSION}.intoto.jsonl" \
            --expected-asset sbom.spdx.json \
            --expected-asset sbom.spdx.json.sigstore.json \
            --expected-asset "stampbot-${VERSION}.vex.json" \
            --expected-asset "stampbot-${VERSION}.vex.json.sigstore.json" \
            --expected-asset "stampbot-${VERSION}.intoto.jsonl"

  release-chart:
    name: Release Helm Chart
    needs: [determine-version, publish-app-release]
    if: >-
      always() &&
      needs.determine-version.result == 'success' &&
      needs.determine-version.outputs.should_release_chart == 'true' &&
      (needs.determine-version.outputs.should_release != 'true' ||
       needs.publish-app-release.result == 'success')
    uses: ./.github/workflows/chart-release.yml
    with:
      app_version: ${{ needs.determine-version.outputs.version }}
    # Pass the app private key through so chart-release.yml can mint its app
    # token when invoked here; custom secrets are not inherited by reusable
    # workflows otherwise (vars like AUTOMATION_ID are available automatically).
    secrets:
      AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write

  deploy-cloudrun:
    name: Deploy to Cloud Run
    needs: [determine-version, build-and-publish-image, publish-app-release]
    if: needs.determine-version.outputs.should_release == 'true' && vars.GOOGLE_PUBLISHING_ENABLED == '1'
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      image_tag: ${{ needs.determine-version.outputs.version }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    permissions:
      contents: read
      id-token: write
