# Sync Poetry lock and requirements.txt when poetry files change
# This workflow regenerates poetry.lock and requirements.txt from pyproject.toml
# when Renovate (or other bots) update dependencies.
name: Sync requirements.txt

on:
  push:
    branches:
      - 'renovate/**'
    paths:
      - 'pyproject.toml'
      - 'poetry.lock'

permissions:
  actions: write
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true

      - name: Install Poetry export plugin
        run: poetry self add poetry-plugin-export==1.10.0

      - name: Update poetry.lock
        run: poetry lock

      - name: Export requirements.txt
        run: poetry export -f requirements.txt -o requirements.txt --only main

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet poetry.lock requirements.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add poetry.lock requirements.txt
          git commit -m "chore: sync poetry lock and requirements"
          git push
          gh workflow run CI --ref "${GITHUB_REF_NAME}" -f run_full_ci=true
          gh workflow run CodeQL --ref "${GITHUB_REF_NAME}"
