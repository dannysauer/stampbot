# Sync Poetry lock and requirements.txt when poetry files change
# This workflow regenerates poetry.lock and requirements.txt from pyproject.toml
# when Renovate (or other bots) update dependencies.
name: Sync requirements.txt

on:
  push:
    branches:
      - 'renovate/**'
    paths:
      - 'pyproject.toml'
      - 'poetry.lock'

permissions: read-all

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_ID }}
          private-key: ${{ secrets.AUTOMATION_SECRET }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: true

      - name: Install Poetry export plugin
        run: poetry self add poetry-plugin-export==1.10.0

      - name: Update poetry.lock
        run: poetry lock

      - name: Export requirements.txt
        run: poetry export -f requirements.txt -o requirements.txt --only main

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet poetry.lock requirements.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          # Match renovate.json gitIgnoredAuthors so Renovate ignores this
          # commit and keeps refreshing the PR after we push the synced files.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock requirements.txt
          git commit -m "chore: sync poetry lock and requirements"
          # Push with the automation app token (persisted by checkout). Unlike
          # GITHUB_TOKEN pushes, which Actions' loop detection suppresses, this
          # re-triggers the PR's CI and CodeQL runs directly, so no manual
          # `gh workflow run` dispatch is needed.
          git push
