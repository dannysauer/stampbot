# Sync requirements.txt when poetry files change
# This workflow regenerates requirements.txt from pyproject.toml/poetry.lock
# when Renovate (or other bots) update dependencies.
name: Sync requirements.txt

on:
  push:
    branches:
      - 'renovate/**'
    paths:
      - 'pyproject.toml'
      - 'poetry.lock'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up tools
        uses: jdx/mise-action@c94f0bf7a520204d413e97d4d2bdafb6965a4598 # v2.2.2
        with:
          cache: true

      - name: Export requirements.txt
        run: poetry export -f requirements.txt -o requirements.txt --only main

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet requirements.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "chore: sync requirements.txt from poetry.lock"
          git push
