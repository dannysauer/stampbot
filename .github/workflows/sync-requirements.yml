# Sync Poetry lock and requirements.txt when poetry files change
# This workflow regenerates poetry.lock and requirements.txt from pyproject.toml
# when Renovate (or other bots) update dependencies.
name: Sync requirements.txt

on:
  push:
    branches:
      - 'renovate/**'
    paths:
      - 'pyproject.toml'
      - 'poetry.lock'

permissions: read-all

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true

      - name: Install Poetry export plugin
        run: poetry self add poetry-plugin-export==1.10.0

      - name: Update poetry.lock
        run: poetry lock

      - name: Export requirements.txt
        run: poetry export -f requirements.txt -o requirements.txt --only main

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet poetry.lock requirements.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          # Match renovate.json gitIgnoredAuthors so Renovate ignores this
          # commit and keeps refreshing the PR after we push the synced files.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock requirements.txt
          git commit -m "chore: sync poetry lock and requirements"
          git push
          gh workflow run CI --ref "${GITHUB_REF_NAME}" -f run_full_ci=true
          gh workflow run CodeQL --ref "${GITHUB_REF_NAME}"
