name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy types-toml

      - name: Run ruff format
        run: ruff format --check stampbot/ tests/

      - name: Run ruff check
        run: ruff check stampbot/ tests/

      - name: Run mypy
        run: mypy stampbot/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        run: |
          pytest tests/ -v \
            --cov=stampbot \
            --cov-branch \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        if: matrix.python-version == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: python-${{ matrix.python-version }}
          fail_ci_if_error: true

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python-version == '3.14'
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  mutation-test:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio cosmic-ray

      - name: Initialize mutation testing
        run: cosmic-ray init cosmic-ray.toml .mutation.sqlite

      - name: Run mutation testing
        run: cosmic-ray --verbosity INFO exec cosmic-ray.toml .mutation.sqlite

      - name: Generate mutation report
        run: |
          # cosmic-ray dump outputs newline-delimited JSON, convert to array
          cosmic-ray dump .mutation.sqlite | python3 -c "
          import json, sys
          data = [json.loads(line) for line in sys.stdin if line.strip()]
          json.dump(data, sys.stdout, indent=2)
          " > mutation-report.json
          cr-html .mutation.sqlite > mutation-report.html

      - name: Calculate mutation score and generate badge
        id: score
        run: |
          python3 << 'EOF'
          import json
          import os

          with open('mutation-report.json') as f:
              data = json.load(f)

          total = len(data)
          killed = sum(1 for m in data if m.get('worker_outcome') == 'KILLED')
          survived = sum(1 for m in data if m.get('worker_outcome') == 'SURVIVED')
          timeout = sum(1 for m in data if m.get('worker_outcome') == 'TIMEOUT')
          incompetent = sum(1 for m in data if m.get('worker_outcome') == 'INCOMPETENT')
          score = (killed / (killed + survived) * 100) if (killed + survived) > 0 else 0

          print(f'Total mutants: {total}')
          print(f'Killed: {killed}')
          print(f'Survived: {survived}')
          print(f'Timeout: {timeout}')
          print(f'Incompetent (invalid mutations): {incompetent}')
          print(f'Mutation score: {score:.1f}%')

          # Write to step summary
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
          with open(summary_file, 'a') as summary:
              summary.write('## Mutation Testing Results\n\n')
              summary.write('| Metric | Value |\n')
              summary.write('|--------|-------|\n')
              summary.write(f'| Total mutants | {total} |\n')
              summary.write(f'| Killed | {killed} |\n')
              summary.write(f'| Survived | {survived} |\n')
              summary.write(f'| Timeout | {timeout} |\n')
              summary.write(f'| Incompetent | {incompetent} |\n')
              summary.write(f'| **Mutation score** | **{score:.1f}%** |\n')

          # Generate badge SVG (shields.io style)
          if score >= 80:
              color = '#4c1'  # bright green
          elif score >= 60:
              color = '#a3c51c'  # yellow-green
          elif score >= 40:
              color = '#dfb317'  # yellow
          else:
              color = '#e05d44'  # red

          score_text = f'{score:.0f}%'
          # Calculate widths (approximate)
          label_width = 62
          value_width = 40
          total_width = label_width + value_width

          badge_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{total_width}" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="a">
              <rect width="{total_width}" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#a)">
              <path fill="#555" d="M0 0h{label_width}v20H0z"/>
              <path fill="{color}" d="M{label_width} 0h{value_width}v20H{label_width}z"/>
              <path fill="url(#b)" d="M0 0h{total_width}v20H0z"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
              <text x="{label_width/2}" y="15" fill="#010101" fill-opacity=".3">mutation</text>
              <text x="{label_width/2}" y="14">mutation</text>
              <text x="{label_width + value_width/2}" y="15" fill="#010101" fill-opacity=".3">{score_text}</text>
              <text x="{label_width + value_width/2}" y="14">{score_text}</text>
            </g>
          </svg>'''

          with open('mutation-badge.svg', 'w') as f:
              f.write(badge_svg)

          print('Badge generated: mutation-badge.svg')
          EOF

      - name: Upload mutation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report
          path: |
            mutation-report.json
            mutation-report.html
            mutation-badge.svg
          retention-days: 30

      - name: Comment on PR with mutation results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('mutation-report.json', 'utf8'));

            const total = data.length;
            const killed = data.filter(m => m.worker_outcome === 'KILLED').length;
            const survived = data.filter(m => m.worker_outcome === 'SURVIVED').length;
            const timeout = data.filter(m => m.worker_outcome === 'TIMEOUT').length;
            const incompetent = data.filter(m => m.worker_outcome === 'INCOMPETENT').length;
            const score = (killed + survived) > 0 ? (killed / (killed + survived) * 100).toFixed(1) : 0;

            // Get surviving mutants for details
            const survivors = data.filter(m => m.worker_outcome === 'SURVIVED').slice(0, 20);
            let survivorDetails = '';
            if (survivors.length > 0) {
              survivorDetails = survivors.map(m =>
                `- \`${m.module_path}:${m.start_pos?.[0] || '?'}\` - ${m.operator_name}`
              ).join('\n');
              if (survived > 20) {
                survivorDetails += `\n- ... and ${survived - 20} more`;
              }
            }

            const body = `## 🧬 Mutation Testing Results

            | Metric | Value |
            |--------|-------|
            | Total mutants | ${total} |
            | Killed | ${killed} |
            | Survived | ${survived} |
            | Timeout | ${timeout} |
            | Incompetent | ${incompetent} |
            | **Mutation score** | **${score}%** |

            <details>
            <summary>What is mutation testing?</summary>

            Mutation testing introduces small changes (mutants) to the code and runs tests against each.
            A "killed" mutant means tests caught the change. A "survived" mutant suggests a gap in test coverage.
            </details>

            ${survived > 0 ? `<details>
            <summary>Surviving mutants (${survived})</summary>

            ${survivorDetails}
            </details>` : '✅ All mutants were killed!'}
            `;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🧬 Mutation Testing Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  deploy-reports:
    name: Deploy Reports to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, mutation-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download coverage report
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: coverage-report
          path: _site/coverage

      - name: Download mutation report
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: mutation-report
          path: _site/mutation

      - name: Create index page
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Stampbot Reports</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
              h1 { color: #333; }
              .reports { display: flex; gap: 20px; flex-wrap: wrap; }
              .report-card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; width: 300px; }
              .report-card h2 { margin-top: 0; }
              .report-card a { display: inline-block; margin-top: 10px; padding: 8px 16px; background: #0366d6; color: white; text-decoration: none; border-radius: 4px; }
              .report-card a:hover { background: #0256b9; }
              .badges { margin: 20px 0; }
              .badges img { margin-right: 8px; }
            </style>
          </head>
          <body>
            <h1>Stampbot Reports</h1>
            <div class="badges">
              <img src="mutation/mutation-badge.svg" alt="Mutation Score">
            </div>
            <div class="reports">
              <div class="report-card">
                <h2>Coverage Report</h2>
                <p>Code coverage analysis showing which lines are tested.</p>
                <a href="coverage/">View Report</a>
              </div>
              <div class="report-card">
                <h2>Mutation Report</h2>
                <p>Mutation testing results showing test effectiveness.</p>
                <a href="mutation/mutation-report.html">View Report</a>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
        env:
          TRIVY_VEX: '.openvex.json'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@b20883b0cd1f46c72ae0ba6d1090936928f9fa30 # v4.32.0
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  security-scan-pr:
    name: Security Scan (PR)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build image for scanning
        run: docker build -t stampbot:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        with:
          image-ref: 'stampbot:scan'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
        env:
          TRIVY_VEX: '.openvex.json'

  helm-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'latest'

      - name: Lint Helm chart
        run: helm lint charts/stampbot

      - name: Template Helm chart
        run: |
          helm template stampbot charts/stampbot \
            --set github.appId=123456 \
            --set github.privateKey="test" \
            --set github.webhookSecret="test"

  helm-validate:
    name: Validate Helm Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'latest'

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate with kubeconform
        run: |
          helm template stampbot charts/stampbot \
            --set github.appId=123456 \
            --set github.privateKey="test" \
            --set github.webhookSecret="test" \
            | kubeconform -strict -ignore-missing-schemas -summary

      - name: Validate with all features enabled
        run: |
          helm template stampbot charts/stampbot \
            --set github.appId=123456 \
            --set github.privateKey="test" \
            --set github.webhookSecret="test" \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=stampbot.example.com \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix \
            --set metrics.serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true \
            --set vpa.enabled=true \
            --set grafanaDashboard.enabled=true \
            | kubeconform -strict -ignore-missing-schemas -summary

  helm-unittest:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'latest'

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false

      - name: Run unit tests
        run: helm unittest charts/stampbot

  helm-install-test-matrix:
    name: Discover Helm Test Cases
    runs-on: ubuntu-latest
    outputs:
      test-cases: ${{ steps.discover.outputs.test-cases }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Discover test cases
        id: discover
        run: |
          # Find all *-values.yaml files and extract test case names
          if ls charts/stampbot/ci/*-values.yaml >/dev/null 2>&1; then
            TEST_CASES=$(ls charts/stampbot/ci/*-values.yaml | \
              xargs -I {} basename {} -values.yaml | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            echo "::warning::No test cases found in charts/stampbot/ci/"
            TEST_CASES='["default"]'
          fi
          echo "test-cases=$TEST_CASES" >> $GITHUB_OUTPUT
          echo "Discovered test cases: $TEST_CASES"

  helm-install-test:
    name: Helm Install Test (${{ matrix.test-case }})
    runs-on: ubuntu-latest
    needs: helm-install-test-matrix
    strategy:
      fail-fast: false
      matrix:
        test-case: ${{ fromJson(needs.helm-install-test-matrix.outputs.test-cases) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'latest'

      - name: Create kind cluster
        uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab # v1.13.0
        with:
          cluster_name: stampbot-${{ matrix.test-case }}

      - name: Build and load image into kind
        run: |
          docker build -t stampbot:ci-test .
          kind load docker-image stampbot:ci-test --name stampbot-${{ matrix.test-case }}

      - name: Create test namespace
        run: kubectl create namespace stampbot-test

      - name: Create test secret
        run: |
          # Fake test key for CI (not a real key)
          TEST_PRIVATE_KEY="-----BEGIN RSA PRIVATE KEY-----
          MIIEpQIBAAKCAQEA0Z3VS5JJcds3xfn/ygWyF8PbnGy0AHB7MxszR3xyEhXxAbdM
          zQPf3+eBe5KMBbOuXKHqfTl3lAwn4nMiPbQGSoNRS9pp0YQWfSSSKFBPSldF3VB5
          k5mUMOiSCXR3JqvXcEpeltwMXJdPOYWh4pmhLMnPJNWGiGJ1SsLVRm8aQsLNwBkS
          fsxNNHxPgDT3AZ3CfzP9tBK0W3o3xP9LPf3lHhXD1v9XhdcGJkBC3qU5vdqN5Pj5
          mJkPS1BzW5wp0kIxFkPf5ta2lJWjnc0TzyiX4dJSASeAljVwxPf5k9y0BANK7g9D
          NNMTMb5A5k3xj1P9wTNFI4dD9gLxXBPq9QI4XQIDAQABAoIBAF8iu4L0Q8OLFNAB
          rC1zT3HPFnjb0jLYhJl3ozdNsbq2cL9IpoReM27v0VEMC0DKKO4l7xOz2KqYVMaY
          nk4ob9GNdGr2mSYNKY9/+3wvEObLLY2E8E9PBgGOaOkimL7h5z9B7k+RX0aHzlOC
          TEST_KEY_NOT_REAL_PLACEHOLDER_FOR_CI_TESTING_PURPOSES_ONLY
          -----END RSA PRIVATE KEY-----"  # pragma: allowlist secret
          kubectl create secret generic stampbot-github \
            --namespace stampbot-test \
            --from-literal=STAMPBOT_APP_ID=123456 \
            --from-literal=STAMPBOT_PRIVATE_KEY="$TEST_PRIVATE_KEY" \
            --from-literal=STAMPBOT_WEBHOOK_SECRET=test-webhook-secret

      - name: Install chart
        run: |
          helm install stampbot charts/stampbot \
            --namespace stampbot-test \
            --values charts/stampbot/ci/${{ matrix.test-case }}-values.yaml \
            --wait \
            --timeout 120s

      - name: Verify deployment
        run: |
          kubectl get pods -n stampbot-test
          kubectl get svc -n stampbot-test
          kubectl rollout status deployment/stampbot -n stampbot-test --timeout=60s

      - name: Check pod is ready
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=stampbot \
            -n stampbot-test \
            --timeout=60s

      - name: Test health endpoint
        run: |
          kubectl port-forward svc/stampbot 8080:80 -n stampbot-test &
          sleep 5
          curl -sf http://localhost:8080/health || exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          kubectl describe pods -n stampbot-test
          kubectl logs -l app.kubernetes.io/name=stampbot -n stampbot-test --tail=100

      - name: Cleanup
        if: always()
        run: |
          helm uninstall stampbot -n stampbot-test || true
          kubectl delete namespace stampbot-test || true
