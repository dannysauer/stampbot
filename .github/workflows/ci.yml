name: CI

on:
  schedule:
    - cron: '0 10 * * *'  # 4AM Central (10:00 UTC)
  workflow_dispatch:  # Manual trigger for scheduled security scan
    inputs:
      run_full_ci:
        description: 'Run the normal CI jobs instead of the scheduled security scan'
        required: false
        default: false
        type: boolean
      image_ref:
        description: 'Container image reference to scan; defaults to ghcr.io/<repo>:main'
        required: false
        type: string
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions: read-all

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_full_ci)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
          version: "2026.3.10"

      - name: Set up Python package cache
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: '.python-version'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --only main,dev

      - name: Run ruff format
        run: poetry run ruff format --check stampbot/ tests/

      - name: Run ruff check
        run: poetry run ruff check stampbot/ tests/

      - name: Run mypy
        run: poetry run mypy stampbot/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_full_ci)
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
          version: "2026.3.10"
        env:
          MISE_PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Set up Python package cache
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --only main,dev

      - name: Run tests
        run: |
          poetry run pytest tests/ -v \
            --cov=stampbot \
            --cov-branch \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.python-version == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: python-${{ matrix.python-version }}
          fail_ci_if_error: true

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.14'
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  mutation-test:
    name: Mutation Testing
    runs-on: ubuntu-latest
    # Run on push to main, or on PRs with the 'do_mutants' label
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'do_mutants')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
          version: "2026.3.10"

      - name: Set up Python package cache
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: '.python-version'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --only main,dev

      - name: Initialize mutation testing
        run: poetry run cosmic-ray init cosmic-ray.toml .mutation.sqlite

      - name: Filter mutation operators
        run: |
          poetry run python << 'EOF'
          import re
          import sqlite3
          import tomllib

          with open("cosmic-ray.toml", "rb") as config_file:
              config = tomllib.load(config_file)

          exclude_operators = config["cosmic-ray"]["filters"]["operators-filter"][
              "exclude-operators"
          ]
          operator_filter = re.compile("|".join(f"(?:{operator})" for operator in exclude_operators))

          connection = sqlite3.connect(".mutation.sqlite")
          job_ids = [
              job_id
              for job_id, operator_name in connection.execute(
                  "SELECT job_id, operator_name FROM mutation_specs"
              )
              if operator_filter.match(operator_name)
          ]

          if job_ids:
              placeholders = ",".join("?" for _ in job_ids)
              connection.execute(
                  f"DELETE FROM mutation_specs WHERE job_id IN ({placeholders})",
                  job_ids,
              )
              connection.execute(
                  f"DELETE FROM work_items WHERE job_id IN ({placeholders})",
                  job_ids,
              )
              connection.commit()

          print(f"Filtered {len(job_ids)} mutation work items")
          EOF

      - name: Run mutation testing
        run: poetry run cosmic-ray --verbosity INFO exec cosmic-ray.toml .mutation.sqlite

      - name: Generate mutation report
        run: |
          # cosmic-ray dump outputs NDJSON where each line is [WorkItem, WorkResult]
          # Flatten to a simpler structure for processing
          poetry run cosmic-ray dump .mutation.sqlite | python3 -c "
          import json, sys
          data = []
          for line in sys.stdin:
              if line.strip():
                  work_item, work_result = json.loads(line)
                  # Merge work_item and work_result into a single dict
                  merged = {**work_item}
                  if work_result:
                      merged.update(work_result)
                  data.append(merged)
          json.dump(data, sys.stdout, indent=2)
          " > mutation-report.json
          poetry run cr-html .mutation.sqlite > mutation-report.html

      - name: Calculate mutation score and generate badge
        id: score
        run: |
          poetry run python << 'EOF'
          import json
          import os

          with open('mutation-report.json') as f:
              data = json.load(f)

          total = len(data)
          killed = sum(1 for m in data if m.get('test_outcome') == 'killed')
          survived = sum(1 for m in data if m.get('test_outcome') == 'survived')
          timeout = sum(1 for m in data if m.get('test_outcome') == 'timeout')
          incompetent = sum(1 for m in data if m.get('test_outcome') == 'incompetent')
          score = (killed / (killed + survived) * 100) if (killed + survived) > 0 else 0

          print(f'Total mutants: {total}')
          print(f'Killed: {killed}')
          print(f'Survived: {survived}')
          print(f'Timeout: {timeout}')
          print(f'Incompetent (invalid mutations): {incompetent}')
          print(f'Mutation score: {score:.1f}%')

          # Write to step summary
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
          with open(summary_file, 'a') as summary:
              summary.write('## Mutation Testing Results\n\n')
              summary.write('| Metric | Value |\n')
              summary.write('|--------|-------|\n')
              summary.write(f'| Total mutants | {total} |\n')
              summary.write(f'| Killed | {killed} |\n')
              summary.write(f'| Survived | {survived} |\n')
              summary.write(f'| Timeout | {timeout} |\n')
              summary.write(f'| Incompetent | {incompetent} |\n')
              summary.write(f'| **Mutation score** | **{score:.1f}%** |\n')

          # Generate badge SVG (shields.io style)
          if score >= 80:
              color = '#4c1'  # bright green
          elif score >= 60:
              color = '#a3c51c'  # yellow-green
          elif score >= 40:
              color = '#dfb317'  # yellow
          else:
              color = '#e05d44'  # red

          score_text = f'{score:.0f}%'
          # Calculate widths (approximate)
          label_width = 62
          value_width = 40
          total_width = label_width + value_width

          badge_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{total_width}" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="a">
              <rect width="{total_width}" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#a)">
              <path fill="#555" d="M0 0h{label_width}v20H0z"/>
              <path fill="{color}" d="M{label_width} 0h{value_width}v20H{label_width}z"/>
              <path fill="url(#b)" d="M0 0h{total_width}v20H0z"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
              <text x="{label_width/2}" y="15" fill="#010101" fill-opacity=".3">mutation</text>
              <text x="{label_width/2}" y="14">mutation</text>
              <text x="{label_width + value_width/2}" y="15" fill="#010101" fill-opacity=".3">{score_text}</text>
              <text x="{label_width + value_width/2}" y="14">{score_text}</text>
            </g>
          </svg>'''

          with open('mutation-badge.svg', 'w') as f:
              f.write(badge_svg)

          print('Badge generated: mutation-badge.svg')
          EOF

      - name: Upload mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            mutation-report.json
            mutation-report.html
            mutation-badge.svg
          retention-days: 30

      - name: Comment on PR with mutation results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('mutation-report.json', 'utf8'));

            const total = data.length;
            const killed = data.filter(m => m.test_outcome === 'killed').length;
            const survived = data.filter(m => m.test_outcome === 'survived').length;
            const timeout = data.filter(m => m.test_outcome === 'timeout').length;
            const incompetent = data.filter(m => m.test_outcome === 'incompetent').length;
            const score = (killed + survived) > 0 ? (killed / (killed + survived) * 100).toFixed(1) : 0;

            // Get surviving mutants for details
            const survivors = data.filter(m => m.test_outcome === 'survived').slice(0, 20);
            let survivorDetails = '';
            if (survivors.length > 0) {
              survivorDetails = survivors.map(m => {
                const mutation = m.mutations?.[0] || {};
                return `- \`${mutation.module_path || '?'}:${mutation.start_pos?.[0] || '?'}\` - ${mutation.operator_name || 'unknown'}`;
              }).join('\n');
              if (survived > 20) {
                survivorDetails += `\n- ... and ${survived - 20} more`;
              }
            }

            const body = `## 🧬 Mutation Testing Results

            | Metric | Value |
            |--------|-------|
            | Total mutants | ${total} |
            | Killed | ${killed} |
            | Survived | ${survived} |
            | Timeout | ${timeout} |
            | Incompetent | ${incompetent} |
            | **Mutation score** | **${score}%** |

            <details>
            <summary>What is mutation testing?</summary>

            Mutation testing introduces small changes (mutants) to the code and runs tests against each.
            A "killed" mutant means tests caught the change. A "survived" mutant suggests a gap in test coverage.
            </details>

            ${survived > 0 ? `<details>
            <summary>Surviving mutants (${survived})</summary>

            ${survivorDetails}
            </details>` : '✅ All mutants were killed!'}
            `;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🧬 Mutation Testing Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  deploy-reports:
    name: Deploy Reports to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, mutation-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: _site/coverage

      - name: Download mutation report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-report
          path: _site/mutation

      - name: Create index page
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Stampbot Reports</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
              h1 { color: #333; }
              .reports { display: flex; gap: 20px; flex-wrap: wrap; }
              .report-card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; width: 300px; }
              .report-card h2 { margin-top: 0; }
              .report-card a { display: inline-block; margin-top: 10px; padding: 8px 16px; background: #0366d6; color: white; text-decoration: none; border-radius: 4px; }
              .report-card a:hover { background: #0256b9; }
              .badges { margin: 20px 0; }
              .badges img { margin-right: 8px; }
            </style>
          </head>
          <body>
            <h1>Stampbot Reports</h1>
            <div class="badges">
              <img src="mutation/mutation-badge.svg" alt="Mutation Score">
            </div>
            <div class="reports">
              <div class="report-card">
                <h2>Coverage Report</h2>
                <p>Code coverage analysis showing which lines are tested.</p>
                <a href="coverage/">View Report</a>
              </div>
              <div class="report-card">
                <h2>Mutation Report</h2>
                <p>Mutation testing results showing test effectiveness.</p>
                <a href="mutation/mutation-report.html">View Report</a>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_full_ci)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            STAMPBOT_VERSION=0.0.0+git.${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          trivyignores: '.trivyignore'
          trivy-config: '.trivy-vex.yaml'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build-pr-image:
    name: Build PR Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_full_ci)
    permissions:
      contents: read
      packages: write
      pull-requests: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract PR metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=pr-

      - name: Build and push PR image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            STAMPBOT_VERSION=0.0.0+git.${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🐳 Docker image built and pushed: \`${{ steps.meta.outputs.tags }}\``
            })

  security-scan-pr:
    name: Security Scan (PR)
    runs-on: ubuntu-latest
    needs: [build-pr-image]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_full_ci)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ needs.build-pr-image.outputs.image-tag }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
          trivy-config: '.trivy-vex.yaml'

  scheduled-security-scan:
    name: Scheduled Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.run_full_ci)
    permissions:
      contents: write  # For pushing VEX branches
      packages: read
      models: read
      issues: write
      pull-requests: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_ID }}
          private-key: ${{ secrets.AUTOMATION_SECRET }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ github.event.inputs.image_ref || format('ghcr.io/{0}:main', github.repository) }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
          trivy-config: '.trivy-vex.yaml'

      - name: Parse vulnerabilities
        id: parse
        run: |
          # Check if Trivy found any results
          if [ ! -f trivy-results.json ]; then
            echo "No Trivy results file found"
            echo "has_vulns=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract vulnerabilities from Trivy JSON output. Keep every package occurrence
          # because one CVE can apply to several packages in the image.
          VULNS=$(jq -r '
            def normalize_purl:
              if . == null or . == "" then
                ""
              else
                split("?")[0] | sub("@[^/@]*$"; "")
              end;

            def package_purl:
              if (.PkgIdentifier.PURL // "") != "" then
                (.PkgIdentifier.PURL | normalize_purl)
              elif (.Class // "") == "os-pkgs" or (.Type // "") == "debian" then
                "pkg:deb/debian/\(.PkgName)"
              elif (.Type // "") == "python-pkg" then
                "pkg:pypi/\(.PkgName)"
              elif (.PkgPath // "" | test("site-packages|dist-info")) then
                "pkg:pypi/\(.PkgName)"
              else
                "pkg:deb/debian/\(.PkgName)"
              end;

            [.Results[]? | .Vulnerabilities[]? | select(. != null)] |
            map({
              id: .VulnerabilityID,
              severity: .Severity,
              title: .Title,
              description: .Description,
              primary_url: .PrimaryURL,
              packages: [{
                name: .PkgName,
                installed_version: .InstalledVersion,
                fixed_version: (.FixedVersion // ""),
                purl: package_purl
              }]
            }) |
            group_by(.id) |
            map({
              id: .[0].id,
              severity: .[0].severity,
              title: .[0].title,
              description: .[0].description,
              primary_url: .[0].primary_url,
              packages: ([.[].packages[]] | unique_by(.purl) | sort_by(.name))
            }) |
            sort_by(.id)
          ' trivy-results.json)

          # Check if any vulnerabilities found
          VULN_COUNT=$(echo "$VULNS" | jq 'length')
          if [ "$VULN_COUNT" -eq 0 ]; then
            echo "No vulnerabilities found"
            echo "has_vulns=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Filter out packages already covered by matching VEX statements.
          NEW_VULNS=$(echo "$VULNS" | jq --slurpfile vex .openvex.json '
            def normalize_purl:
              if . == null or . == "" then
                ""
              else
                split("?")[0] | sub("@[^/@]*$"; "")
              end;

            def statement_components($statement):
              [
                $statement.products[]? |
                if ((.subcomponents // []) | length) > 0 then
                  .subcomponents[]?."@id"
                else
                  ."@id"
                end |
                normalize_purl
              ];

            def statement_is_container_wildcard($statement):
              any($statement.products[]?;
                (."@id" | startswith("pkg:oci/")) and (((.subcomponents // []) | length) == 0)
              );

            def is_covered($id; $purl):
              any($vex[0].statements[]?;
                .vulnerability.name == $id and
                (statement_is_container_wildcard(.) or (statement_components(.) | index($purl)))
              );

            map(
              . as $vuln |
              .packages = [
                $vuln.packages[] |
                select(.purl as $purl | is_covered($vuln.id; $purl) | not)
              ] |
              select((.packages | length) > 0)
            )
          ')

          NEW_VULN_COUNT=$(echo "$NEW_VULNS" | jq 'length')
          if [ "$NEW_VULN_COUNT" -eq 0 ]; then
            echo "All vulnerabilities already handled in VEX"
            echo "has_vulns=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $NEW_VULN_COUNT new vulnerabilities to analyze"
          echo "has_vulns=true" >> "$GITHUB_OUTPUT"

          # Save for next step (escape for GitHub Actions)
          {
            echo "vuln_data<<EOF"
            echo "$NEW_VULNS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Analyze and remediate vulnerabilities
        if: steps.parse.outputs.has_vulns == 'true'
        env:
          # GITHUB_TOKEN drives the GitHub Models AI call (models:read) and the
          # security-issue creation; app installation tokens lack models:read.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APP_TOKEN opens the VEX PR as the automation app so its CI runs --
          # PRs opened with GITHUB_TOKEN are suppressed by Actions loop detection.
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          VULN_DATA: ${{ steps.parse.outputs.vuln_data }}
        run: |
          set -euo pipefail

          # Application context for AI analysis
          APP_CONTEXT="This is stampbot, a GitHub App that automatically approves pull requests.

          Security-relevant application context:
          - Uses PEM-format private keys for JWT signing (RS256) to authenticate as a GitHub App
          - Makes outbound HTTPS connections to GitHub API only
          - Does NOT parse CMS, PKCS#7, S/MIME, or PKCS#12 files
          - Does NOT accept untrusted cryptographic input
          - Does NOT process user-uploaded files
          - Protobuf is only used for outbound OTLP trace export to a trusted collector
          - The application runs in a container and processes GitHub webhook events"

          BASE_SHA=$(git rev-parse HEAD)
          BULK_BRANCH="security/vex-bulk-$(date -u +%Y%m%d%H%M%S)"
          UPDATED_CVES=$(mktemp)

          git checkout -B "$BULK_BRANCH" "$BASE_SHA"

          # Process each vulnerability
          echo "$VULN_DATA" | jq -c '.[]' | while read -r vuln; do
            CVE_ID=$(echo "$vuln" | jq -r '.id')
            SEVERITY=$(echo "$vuln" | jq -r '.severity')
            TITLE=$(echo "$vuln" | jq -r '.title')
            DESCRIPTION=$(echo "$vuln" | jq -r '.description')
            PRIMARY_URL=$(echo "$vuln" | jq -r '.primary_url')
            PACKAGE_SUMMARY=$(echo "$vuln" | jq -r '
              .packages[] |
              "- \(.name) (installed: \(.installed_version), fixed: \(
                if (.fixed_version // "") == "" then "none available" else .fixed_version end
              ), purl: \(.purl))"
            ')
            PACKAGE_NAMES=$(echo "$vuln" | jq -r '[.packages[].name] | unique | join(", ")')
            SUBCOMPONENTS=$(echo "$vuln" | jq -c '[.packages[].purl] | unique | sort')

            echo "::group::Analyzing $CVE_ID"
            echo "Packages:"
            echo "$PACKAGE_SUMMARY"
            echo "Severity: $SEVERITY"
            echo "Title: $TITLE"

            # Check for existing issue
            EXISTING_ISSUE=$(gh issue list --search "$CVE_ID in:title" --json number --jq '.[0].number // empty' || true)
            if [ -n "$EXISTING_ISSUE" ]; then
              echo "Issue #$EXISTING_ISSUE already exists for $CVE_ID, skipping"
              echo "::endgroup::"
              continue
            fi

            # Build AI prompt
          PROMPT="Analyze whether this vulnerability affects the application.

          Vulnerability: $CVE_ID
          Packages:
          $PACKAGE_SUMMARY
          Severity: $SEVERITY
          Title: $TITLE
          Description: $DESCRIPTION
          Reference: $PRIMARY_URL

          Application context:
          $APP_CONTEXT

          Based on how this application uses the affected package, determine if the vulnerability is exploitable.

          Respond with JSON only:
          {
            \"affected\": true or false,
            \"justification\": \"one of: component_not_present, vulnerable_code_not_present, vulnerable_code_not_in_execute_path, vulnerable_code_cannot_be_controlled_by_adversary, inline_mitigations_already_exist\",
            \"impact_statement\": \"Brief explanation of why the app is or is not affected\"
          }"

            # Call GitHub Models API with retries
            AI_RESPONSE=""
            for attempt in 1 2 3; do
              echo "AI API attempt $attempt..."
              AI_RESPONSE=$(curl -sS --fail-with-body \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                "https://models.github.ai/inference/chat/completions" \
                -d "$(jq -n \
                  --arg prompt "$PROMPT" \
                  '{
                    model: "openai/gpt-4o",
                    messages: [{role: "user", content: $prompt}],
                    response_format: {type: "json_object"},
                    temperature: 0.1
                  }')" 2>&1) && break
              echo "Attempt $attempt failed, retrying..."
              sleep $((attempt * 5))
            done

            if [ -z "$AI_RESPONSE" ]; then
              echo "::warning::AI API failed after 3 attempts for $CVE_ID, creating manual review issue"
              gh issue create \
                --title "Security: Manual review needed for $CVE_ID" \
                --label "security" \
                --body "## Vulnerability Details

          | Field | Value |
          |-------|-------|
          | CVE | $CVE_ID |
          | Packages | $PACKAGE_NAMES |
          | Severity | $SEVERITY |

          ## Packages
          $PACKAGE_SUMMARY

          ## Description
          $TITLE

          $DESCRIPTION

          ## Reference
          $PRIMARY_URL

          ## Action Required
          AI analysis failed. Please manually review whether this vulnerability affects stampbot and either:
          1. Add a VEX statement to \`.openvex.json\` if not affected
          2. Investigate remediation if affected"
              echo "::endgroup::"
              continue
            fi

            # Parse AI response
            AI_CONTENT=$(echo "$AI_RESPONSE" | jq -r '.choices[0].message.content // empty')
            if [ -z "$AI_CONTENT" ]; then
              echo "::warning::Empty AI response for $CVE_ID"
              echo "::endgroup::"
              continue
            fi

            AFFECTED=$(echo "$AI_CONTENT" | jq -r '.affected')
            JUSTIFICATION=$(echo "$AI_CONTENT" | jq -r '.justification')
            IMPACT_STATEMENT=$(echo "$AI_CONTENT" | jq -r '.impact_statement')

            echo "AI Analysis: affected=$AFFECTED, justification=$JUSTIFICATION"

            if [ "$AFFECTED" = "false" ]; then
              echo "Updating VEX statement for $CVE_ID"

              # Update .openvex.json
              TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              CURRENT_VERSION=$(jq '.version' .openvex.json)
              NEW_VERSION=$((CURRENT_VERSION + 1))

              # Add a new VEX statement, or complete the existing not_affected
              # statement for this CVE with any missing vulnerable packages.
              jq --arg cve_id "$CVE_ID" \
                 --arg title "$TITLE" \
                 --arg justification "$JUSTIFICATION" \
                 --arg impact "$IMPACT_STATEMENT" \
                 --arg timestamp "$TIMESTAMP" \
                 --argjson products "$SUBCOMPONENTS" \
                 --argjson new_version "$NEW_VERSION" \
                 '
                 def product_objects:
                   $products | map({"@id": .});

                 def non_container_products:
                   [.products[]? | select(."@id" | startswith("pkg:oci/") | not)];

                  .version = $new_version |
                  .timestamp = $timestamp |
                  if any(.statements[]?; .vulnerability.name == $cve_id and .status == "not_affected") then
                    .statements = (
                      .statements | map(
                        if .vulnerability.name == $cve_id and .status == "not_affected" then
                          .justification = $justification |
                          .impact_statement = $impact |
                          .products = ((non_container_products + product_objects) | unique_by(."@id"))
                        else
                          .
                        end
                      )
                    )
                  else
                    .statements += [{
                      vulnerability: {
                        "@id": "https://nvd.nist.gov/vuln/detail/\($cve_id)",
                        name: $cve_id,
                        description: $title
                      },
                      products: product_objects,
                      status: "not_affected",
                      justification: $justification,
                      impact_statement: $impact
                    }]
                  end
                 ' .openvex.json > .openvex.json.tmp
              mv .openvex.json.tmp .openvex.json

              echo "- $CVE_ID: $PACKAGE_NAMES" >> "$UPDATED_CVES"
            else
              # Create security issue
              echo "Creating security issue for $CVE_ID"
              gh issue create \
                --title "Security: $CVE_ID affects stampbot" \
                --label "security" \
                --body "## Vulnerability Details

          | Field | Value |
          |-------|-------|
          | CVE | $CVE_ID |
          | Packages | $PACKAGE_NAMES |
          | Severity | $SEVERITY |

          ## Packages
          $PACKAGE_SUMMARY

          ## Description
          $TITLE

          $DESCRIPTION

          ## AI Analysis
          **Impact Statement:** $IMPACT_STATEMENT

          ## Reference
          $PRIMARY_URL

          ## Recommended Actions
          1. Update affected packages if patched versions are available
          2. If no fix available, implement mitigations or accept risk

          ---
          *This issue was automatically generated by the scheduled security scan.*"
            fi

            echo "::endgroup::"
          done

          if git diff --quiet -- .openvex.json; then
            echo "No VEX updates were generated"
            echo "Security scan complete"
            exit 0
          fi

          UPDATED_CVE_LIST=$(cat "$UPDATED_CVES")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .openvex.json
          git commit -m "chore(security): update VEX statements from scheduled scan"
          git push origin "$BULK_BRANCH"

          NEW_PR_URL=$(GH_TOKEN="$APP_TOKEN" gh pr create \
            --title "chore(security): update VEX statements from scheduled scan" \
            --body "## Summary
          - Update VEX statements for all not-affected vulnerabilities found by the scheduled scan
          - Cover all currently reported vulnerable packages for each CVE

          ## CVEs Updated
          $UPDATED_CVE_LIST

          ---
          *This PR was automatically generated by the scheduled security scan.*")
          NEW_PR_NUMBER=$(echo "$NEW_PR_URL" | grep -oE '[0-9]+$' || true)
          echo "Created PR: $NEW_PR_URL"

          # Close previous scheduled-scan PRs whose VEX statements are now fully
          # contained in this run's .openvex.json. Each run branches from main and
          # re-adds every still-uncovered CVE, so a newer PR is normally a superset
          # of the older open ones, leaving them redundant.
          #
          # Reduce a VEX file to a sorted set of "status|cve|product" tuples so two
          # files can be compared with `comm`. A normalized purl drops version/
          # qualifier noise, and container-level products are expanded to their
          # subcomponents to match the granularity used when statements are written.
          vex_statement_tuples() {
            jq -r '
              def normalize_purl:
                if . == null or . == "" then
                  ""
                else
                  split("?")[0] | sub("@[^/@]*$"; "")
                end;

              .statements[]? | . as $s |
              ( [
                  $s.products[]? |
                  if ((.subcomponents // []) | length) > 0 then
                    .subcomponents[]?."@id"
                  else
                    ."@id"
                  end
                  | normalize_purl
                ] ) as $products |
              $products[] | "\($s.status)|\($s.vulnerability.name)|\(.)"
            ' "$1" | sort -u
          }

          NEW_TUPLES=$(mktemp)
          vex_statement_tuples .openvex.json > "$NEW_TUPLES"

          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("security/vex-bulk-")) | .number' |
          while read -r PR; do
            [ -z "$PR" ] && continue
            [ "$PR" = "$NEW_PR_NUMBER" ] && continue

            OLD_BRANCH=$(gh pr view "$PR" --json headRefName --jq '.headRefName')
            if ! git fetch --quiet origin "$OLD_BRANCH" 2>/dev/null; then
              echo "Could not fetch branch for PR #$PR ($OLD_BRANCH), skipping"
              continue
            fi

            OLD_FILE=$(mktemp)
            if ! git show "origin/$OLD_BRANCH:.openvex.json" > "$OLD_FILE" 2>/dev/null; then
              echo "PR #$PR has no .openvex.json, skipping"
              rm -f "$OLD_FILE"
              continue
            fi

            OLD_TUPLES=$(mktemp)
            vex_statement_tuples "$OLD_FILE" > "$OLD_TUPLES"

            # Skip empty results so we never close a PR that added no statements.
            if [ ! -s "$OLD_TUPLES" ]; then
              echo "PR #$PR has no VEX statements, skipping"
              rm -f "$OLD_FILE" "$OLD_TUPLES"
              continue
            fi

            # Tuples present in the old PR but absent from this run's file. Empty
            # means the old PR is a subset of (or equal to) the new one.
            MISSING=$(comm -23 "$OLD_TUPLES" "$NEW_TUPLES")
            if [ -z "$MISSING" ]; then
              echo "Closing PR #$PR: superseded by #$NEW_PR_NUMBER"
              gh pr close "$PR" \
                --comment "Superseded by #$NEW_PR_NUMBER, which now includes all of this PR's VEX statements. Closing as redundant." \
                --delete-branch || echo "::warning::Failed to close PR #$PR"
            else
              echo "Keeping PR #$PR: contains statements not in #$NEW_PR_NUMBER"
            fi

            rm -f "$OLD_FILE" "$OLD_TUPLES"
          done

          echo "Security scan complete"

  helm-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_full_ci)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
          version: "2026.3.10"

      - name: Lint Helm chart
        run: helm lint charts/stampbot

      - name: Template Helm chart
        run: |
          helm template stampbot charts/stampbot \
            --set github.appId=123456 \
            --set github.privateKey="test" \
            --set github.webhookSecret="test"

  helm-validate:
    name: Validate Helm Templates
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_full_ci)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
          version: "2026.3.10"

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate with kubeconform
        run: |
          helm template stampbot charts/stampbot \
            --set github.appId=123456 \
            --set github.privateKey="test" \
            --set github.webhookSecret="test" \
            | kubeconform -strict -ignore-missing-schemas -summary

      - name: Validate with all features enabled
        run: |
          helm template stampbot charts/stampbot \
            --set github.appId=123456 \
            --set github.privateKey="test" \
            --set github.webhookSecret="test" \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=stampbot.example.com \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix \
            --set metrics.serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true \
            --set vpa.enabled=true \
            --set grafanaDashboard.enabled=true \
            | kubeconform -strict -ignore-missing-schemas -summary

  helm-unittest:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_full_ci)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
          version: "2026.3.10"

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false

      - name: Run unit tests
        run: helm unittest charts/stampbot

  helm-install-test-matrix:
    name: Discover Helm Test Cases
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_full_ci)
    outputs:
      test-cases: ${{ steps.discover.outputs.test-cases }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Discover test cases
        id: discover
        run: |
          # Find all *-values.yaml files and extract test case names
          if ls charts/stampbot/ci/*-values.yaml >/dev/null 2>&1; then
            TEST_CASES=$(ls charts/stampbot/ci/*-values.yaml | \
              xargs -I {} basename {} -values.yaml | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            echo "::warning::No test cases found in charts/stampbot/ci/"
            TEST_CASES='["default"]'
          fi
          echo "test-cases=$TEST_CASES" >> $GITHUB_OUTPUT
          echo "Discovered test cases: $TEST_CASES"

  helm-install-test:
    name: Helm Install Test (${{ matrix.test-case }})
    runs-on: ubuntu-latest
    needs: helm-install-test-matrix
    strategy:
      fail-fast: false
      matrix:
        test-case: ${{ fromJson(needs.helm-install-test-matrix.outputs.test-cases) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
          version: "2026.3.10"

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: stampbot-${{ matrix.test-case }}

      - name: Build and load image into kind
        run: |
          docker build \
            --build-arg STAMPBOT_VERSION=0.0.0+git.${{ github.sha }} \
            -t stampbot:ci-test .
          kind load docker-image stampbot:ci-test --name stampbot-${{ matrix.test-case }}

      - name: Create test namespace
        run: kubectl create namespace stampbot-test

      - name: Create test secret
        run: |
          # Fake test key for CI (not a real key)
          TEST_PRIVATE_KEY="-----BEGIN RSA PRIVATE KEY-----
          MIIEpQIBAAKCAQEA0Z3VS5JJcds3xfn/ygWyF8PbnGy0AHB7MxszR3xyEhXxAbdM
          zQPf3+eBe5KMBbOuXKHqfTl3lAwn4nMiPbQGSoNRS9pp0YQWfSSSKFBPSldF3VB5
          k5mUMOiSCXR3JqvXcEpeltwMXJdPOYWh4pmhLMnPJNWGiGJ1SsLVRm8aQsLNwBkS
          fsxNNHxPgDT3AZ3CfzP9tBK0W3o3xP9LPf3lHhXD1v9XhdcGJkBC3qU5vdqN5Pj5
          mJkPS1BzW5wp0kIxFkPf5ta2lJWjnc0TzyiX4dJSASeAljVwxPf5k9y0BANK7g9D
          NNMTMb5A5k3xj1P9wTNFI4dD9gLxXBPq9QI4XQIDAQABAoIBAF8iu4L0Q8OLFNAB
          rC1zT3HPFnjb0jLYhJl3ozdNsbq2cL9IpoReM27v0VEMC0DKKO4l7xOz2KqYVMaY
          nk4ob9GNdGr2mSYNKY9/+3wvEObLLY2E8E9PBgGOaOkimL7h5z9B7k+RX0aHzlOC
          TEST_KEY_NOT_REAL_PLACEHOLDER_FOR_CI_TESTING_PURPOSES_ONLY
          -----END RSA PRIVATE KEY-----"  # pragma: allowlist secret
          kubectl create secret generic stampbot-github \
            --namespace stampbot-test \
            --from-literal=STAMPBOT_APP_ID=123456 \
            --from-literal=STAMPBOT_PRIVATE_KEY="$TEST_PRIVATE_KEY" \
            --from-literal=STAMPBOT_WEBHOOK_SECRET=test-webhook-secret

      - name: Run test-case setup hook (if present)
        run: |
          # Optional per-case hook for prerequisites a feature needs before
          # install (e.g. CRDs). Auto-discovered like the values files: a case
          # named <case> may ship charts/stampbot/ci/<case>-setup.sh.
          HOOK="charts/stampbot/ci/${{ matrix.test-case }}-setup.sh"
          if [ -f "$HOOK" ]; then
            echo "Running setup hook: $HOOK"
            bash "$HOOK"
          else
            echo "No setup hook for test case '${{ matrix.test-case }}'"
          fi

      - name: Install chart
        run: |
          helm install stampbot charts/stampbot \
            --namespace stampbot-test \
            --values charts/stampbot/ci/${{ matrix.test-case }}-values.yaml \
            --wait \
            --timeout 120s

      - name: Verify deployment
        run: |
          kubectl get pods -n stampbot-test
          kubectl get svc -n stampbot-test
          kubectl rollout status deployment/stampbot -n stampbot-test --timeout=60s

      - name: Check pod is ready
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=stampbot \
            -n stampbot-test \
            --timeout=60s

      - name: Run helm tests
        run: |
          # Chart-shipped helm test hooks: endpoint reachability + readiness
          # (test-connection) and the signed/tampered webhook path (test-webhook).
          helm test stampbot -n stampbot-test --logs --timeout 120s

      - name: Show logs on failure
        if: failure()
        run: |
          kubectl describe pods -n stampbot-test
          # Captures the deployment and the helm test hook pods (both carry
          # app.kubernetes.io/name=stampbot).
          kubectl logs -l app.kubernetes.io/name=stampbot -n stampbot-test --tail=100 --prefix

      - name: Cleanup
        if: always()
        run: |
          helm uninstall stampbot -n stampbot-test || true
          kubectl delete namespace stampbot-test || true

  helm-upgrade-test-matrix:
    name: Discover Helm Upgrade Versions
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_full_ci)
    outputs:
      from-versions: ${{ steps.discover.outputs.from-versions }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Discover upgrade-from versions
        id: discover
        run: |
          # Upgrade-from set = latest patch of the current chart minor line and
          # the previous up-to-two minor lines (i.e. the newest patch of each of
          # the top 3 minor lines). Computed from chart-vX.Y.Z tags so it tracks
          # future releases instead of being hardcoded.
          versions=$(git tag -l 'chart-v*' \
            | sed 's/^chart-v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -z "$versions" ]; then
            echo "::warning::No chart-v* tags found; skipping upgrade test"
            echo 'from-versions=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Latest patch per major.minor line.
          latest=$(echo "$versions" \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | awk -F. '{ latest[$1"."$2]=$0 } END { for (k in latest) print latest[k] }')
          # Newest 3 minor lines, as a JSON array.
          json=$(echo "$latest" \
            | sort -t. -k1,1nr -k2,2nr | head -3 \
            | awk 'BEGIN{printf "["} {printf "%s\"%s\"", (NR>1?",":""), $0} END{printf "]"}')
          echo "from-versions=$json" >> "$GITHUB_OUTPUT"
          echo "Upgrade-from versions: $json"

  helm-upgrade-test:
    name: Helm Upgrade Test (from ${{ matrix.from-version }})
    runs-on: ubuntu-latest
    needs: helm-upgrade-test-matrix
    if: needs.helm-upgrade-test-matrix.outputs.from-versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        from-version: ${{ fromJson(needs.helm-upgrade-test-matrix.outputs.from-versions) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
          version: "2026.3.10"

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: stampbot-upgrade

      - name: Build and load image into kind
        run: |
          docker build \
            --build-arg STAMPBOT_VERSION=0.0.0+git.${{ github.sha }} \
            -t stampbot:ci-test .
          kind load docker-image stampbot:ci-test --name stampbot-upgrade

      - name: Create test namespace
        run: kubectl create namespace stampbot-test

      - name: Create test secret
        run: |
          # Fake test key for CI (not a real key)
          TEST_PRIVATE_KEY="-----BEGIN RSA PRIVATE KEY-----
          MIIEpQIBAAKCAQEA0Z3VS5JJcds3xfn/ygWyF8PbnGy0AHB7MxszR3xyEhXxAbdM
          zQPf3+eBe5KMBbOuXKHqfTl3lAwn4nMiPbQGSoNRS9pp0YQWfSSSKFBPSldF3VB5
          k5mUMOiSCXR3JqvXcEpeltwMXJdPOYWh4pmhLMnPJNWGiGJ1SsLVRm8aQsLNwBkS
          fsxNNHxPgDT3AZ3CfzP9tBK0W3o3xP9LPf3lHhXD1v9XhdcGJkBC3qU5vdqN5Pj5
          mJkPS1BzW5wp0kIxFkPf5ta2lJWjnc0TzyiX4dJSASeAljVwxPf5k9y0BANK7g9D
          NNMTMb5A5k3xj1P9wTNFI4dD9gLxXBPq9QI4XQIDAQABAoIBAF8iu4L0Q8OLFNAB
          rC1zT3HPFnjb0jLYhJl3ozdNsbq2cL9IpoReM27v0VEMC0DKKO4l7xOz2KqYVMaY
          nk4ob9GNdGr2mSYNKY9/+3wvEObLLY2E8E9PBgGOaOkimL7h5z9B7k+RX0aHzlOC
          TEST_KEY_NOT_REAL_PLACEHOLDER_FOR_CI_TESTING_PURPOSES_ONLY
          -----END RSA PRIVATE KEY-----"  # pragma: allowlist secret
          kubectl create secret generic stampbot-github \
            --namespace stampbot-test \
            --from-literal=STAMPBOT_APP_ID=123456 \
            --from-literal=STAMPBOT_PRIVATE_KEY="$TEST_PRIVATE_KEY" \
            --from-literal=STAMPBOT_WEBHOOK_SECRET=test-webhook-secret

      - name: Install released chart ${{ matrix.from-version }}
        run: |
          # Pull and install the previously released chart, but run it on the
          # locally built image so the test exercises the *chart* upgrade
          # (manifests, immutable fields, hooks) rather than image availability.
          helm pull oci://ghcr.io/dannysauer/charts/stampbot \
            --version "${{ matrix.from-version }}" \
            --untar --untardir /tmp/oldchart
          helm install stampbot /tmp/oldchart/stampbot \
            --namespace stampbot-test \
            --set image.repository=stampbot \
            --set image.tag=ci-test \
            --set image.pullPolicy=Never \
            --set replicaCount=1 \
            --set autoscaling.enabled=false \
            --set podDisruptionBudget.enabled=false \
            --set github.existingSecret=stampbot-github \
            --wait \
            --timeout 120s

      - name: Upgrade to working-tree chart
        run: |
          helm upgrade stampbot charts/stampbot \
            --namespace stampbot-test \
            --values charts/stampbot/ci/default-values.yaml \
            --wait \
            --timeout 120s

      - name: Verify rollout after upgrade
        run: |
          kubectl rollout status deployment/stampbot -n stampbot-test --timeout=60s
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=stampbot \
            -n stampbot-test \
            --timeout=60s

      - name: Run helm tests
        run: |
          # Verify the upgraded release with the chart-shipped helm test hooks.
          helm test stampbot -n stampbot-test --logs --timeout 120s

      - name: Show logs on failure
        if: failure()
        run: |
          kubectl describe pods -n stampbot-test
          kubectl logs -l app.kubernetes.io/name=stampbot -n stampbot-test --tail=100 --prefix

      - name: Cleanup
        if: always()
        run: |
          helm uninstall stampbot -n stampbot-test || true
          kubectl delete namespace stampbot-test || true
