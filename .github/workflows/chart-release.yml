name: Chart Release

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version to set as appVersion (optional, defaults to latest v* tag)'
        required: false
        type: string
  workflow_call:
    inputs:
      app_version:
        description: 'App version to set as appVersion'
        required: false
        type: string

permissions:
  contents: read

env:
  CHART_DIR: charts/stampbot
  REGISTRY: ghcr.io
  CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release-chart:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # For keyless signing with cosign/Sigstore
      packages: write
    outputs:
      release_asset_hashes: ${{ steps.provenance-subjects.outputs.hashes }}
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # Full history for version calculation

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true

      - name: Calculate next chart version
        id: version
        run: |
          # Get the latest chart tag
          LATEST_CHART_TAG=$(git tag -l 'chart-v*' --sort=-v:refname | head -n1)

          if [ -z "$LATEST_CHART_TAG" ]; then
            echo "No previous chart tag found, starting at 0.1.0"
            CURRENT_VERSION="0.0.0"
            COMMIT_RANGE="HEAD"
          else
            CURRENT_VERSION="${LATEST_CHART_TAG#chart-v}"
            COMMIT_RANGE="${LATEST_CHART_TAG}..HEAD"
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Analyzing commits in range: $COMMIT_RANGE"

          # Parse current version
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          # Analyze commits for version bump type
          BUMP_TYPE="patch"

          # Check for breaking changes (BREAKING CHANGE in body or ! after type)
          if git log "$COMMIT_RANGE" --pretty=format:"%B" | grep -qE "(^BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!:)"; then
            BUMP_TYPE="major"
          # Check for features
          elif git log "$COMMIT_RANGE" --pretty=format:"%s" | grep -qE "^feat(\([^)]*\))?:"; then
            BUMP_TYPE="minor"
          fi

          echo "Bump type: $BUMP_TYPE"

          # Calculate new version
          case "$BUMP_TYPE" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
          esac

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=chart-v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Get app version
        id: app_version
        run: |
          if [ -n "${{ inputs.app_version }}" ]; then
            APP_VERSION="${{ inputs.app_version }}"
          else
            # Get latest app version tag
            APP_VERSION=$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
            if [ -z "$APP_VERSION" ]; then
              echo "::warning::No app version tag (v*) found. Using 0.1.0 as initial appVersion."
              APP_VERSION="0.1.0"
            fi
          fi
          echo "App version: $APP_VERSION"
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Check if release needed
        id: check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Chart.yaml versions
        if: steps.check.outputs.skip != 'true'
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          APP_VERSION="${{ steps.app_version.outputs.app_version }}"

          echo "Setting chart version to: $CHART_VERSION"
          echo "Setting app version to: $APP_VERSION"

          sed -i "s/^version: 0.0.0-placeholder$/version: ${CHART_VERSION}/" "${{ env.CHART_DIR }}/Chart.yaml"
          sed -i "s/^appVersion: 0.0.0-placeholder$/appVersion: ${APP_VERSION}/" "${{ env.CHART_DIR }}/Chart.yaml"

          echo "Updated Chart.yaml:"
          cat "${{ env.CHART_DIR }}/Chart.yaml"

      - name: Lint chart
        if: steps.check.outputs.skip != 'true'
        run: helm lint "${{ env.CHART_DIR }}"

      - name: Package chart
        if: steps.check.outputs.skip != 'true'
        run: |
          helm package "${{ env.CHART_DIR }}" --destination .
          ls -la *.tgz

      - name: Sign chart package
        if: steps.check.outputs.skip != 'true'
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          cosign sign-blob --yes \
            --bundle "stampbot-${CHART_VERSION}.tgz.sigstore.json" \
            "stampbot-${CHART_VERSION}.tgz"

      - name: Generate SLSA provenance subjects
        id: provenance-subjects
        if: steps.check.outputs.skip != 'true'
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          echo "hashes=$(sha256sum "stampbot-${CHART_VERSION}.tgz" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to OCI registry
        if: steps.check.outputs.skip != 'true'
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          helm push "stampbot-${CHART_VERSION}.tgz" "oci://${{ env.CHART_REPO }}"

      - name: Create Git tag
        if: steps.check.outputs.skip != 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Generate changelog
        if: steps.check.outputs.skip != 'true'
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="${{ steps.app_version.outputs.app_version }}"
          LATEST_CHART_TAG=$(git tag -l 'chart-v*' --sort=-v:refname | head -n2 | tail -n1)
          if [ -z "$LATEST_CHART_TAG" ] || [ "$LATEST_CHART_TAG" = "${{ steps.version.outputs.tag }}" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="${LATEST_CHART_TAG}..HEAD"
          fi

          # Start with container version info
          echo "## Container Version" > changelog.md
          echo "" >> changelog.md
          echo "This chart deploys **stampbot v${APP_VERSION}**" >> changelog.md
          echo "" >> changelog.md
          echo "- Container image: \`ghcr.io/${{ github.repository }}:${APP_VERSION}\`" >> changelog.md
          echo "- [View container release](https://github.com/${{ github.repository }}/releases/tag/v${APP_VERSION})" >> changelog.md
          echo "" >> changelog.md

          # Include the app changelog from its GitHub Release
          APP_CHANGELOG=$(gh release view "v${APP_VERSION}" --json body --jq '.body' 2>/dev/null || true)
          if [ -n "$APP_CHANGELOG" ]; then
            echo "## App Changelog" >> changelog.md
            echo "" >> changelog.md
            echo "$APP_CHANGELOG" >> changelog.md
            echo "" >> changelog.md
          fi

          echo "## Chart Changes" >> changelog.md
          echo "" >> changelog.md

          # Group commits by type
          FOUND_COMMITS=false
          for type in feat fix docs chore refactor test ci; do
            COMMITS=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --grep="^${type}:" --grep="^${type}(" -E 2>/dev/null || true)
            if [ -n "$COMMITS" ]; then
              FOUND_COMMITS=true
              case $type in
                feat) echo "### 🚀 Features" >> changelog.md ;;
                fix) echo "### 🐛 Bug Fixes" >> changelog.md ;;
                docs) echo "### 📚 Documentation" >> changelog.md ;;
                chore) echo "### 🔧 Maintenance" >> changelog.md ;;
                refactor) echo "### ♻️ Refactoring" >> changelog.md ;;
                test) echo "### 🧪 Tests" >> changelog.md ;;
                ci) echo "### 🏗️ CI/CD" >> changelog.md ;;
              esac
              echo "$COMMITS" >> changelog.md
              echo "" >> changelog.md
            fi
          done

          if [ "$FOUND_COMMITS" = false ]; then
            echo "- Chart updated for stampbot v${APP_VERSION}" >> changelog.md
            echo "" >> changelog.md
          fi

          echo "" >> changelog.md
          if [ -n "$LATEST_CHART_TAG" ] && [ "$LATEST_CHART_TAG" != "${{ steps.version.outputs.tag }}" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_CHART_TAG}...${{ steps.version.outputs.tag }}" >> changelog.md
          fi

          cat changelog.md

      - name: Create GitHub Release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Helm Chart ${{ steps.version.outputs.version }}"
          body_path: changelog.md
          files: |
            stampbot-${{ steps.version.outputs.version }}.tgz
            stampbot-${{ steps.version.outputs.version }}.tgz.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-chart-provenance:
    name: Generate Chart Release SLSA Provenance
    needs: release-chart
    if: needs.release-chart.outputs.skip != 'true'
    permissions:
      actions: read  # For reusable workflow path detection
      contents: write  # For release asset upload
      id-token: write  # For keyless SLSA provenance signing
    # SLSA generator workflows must use a full semantic tag for slsa-verifier compatibility.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release-chart.outputs.release_asset_hashes }}
      provenance-name: stampbot-chart-${{ needs.release-chart.outputs.version }}.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ needs.release-chart.outputs.tag }}
