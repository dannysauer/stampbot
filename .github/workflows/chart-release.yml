name: Chart Release

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version to set as appVersion (optional, defaults to latest v* tag)'
        required: false
        type: string
      retry_tag:
        description: 'Existing chart tag to retry (must point at default-branch HEAD)'
        required: false
        type: string
  workflow_call:
    inputs:
      app_version:
        description: 'App version to set as appVersion'
        required: false
        type: string
    secrets:
      AUTOMATION_SECRET:
        description: 'Automation GitHub App private key (PEM)'
        required: false

permissions:
  contents: read

concurrency:
  # This group is intentionally distinct from the app publisher. It also
  # serializes manual dispatches with calls from release.yml.
  group: stampbot-chart-release-${{ github.repository }}
  cancel-in-progress: false

env:
  CHART_DIR: charts/stampbot
  REGISTRY: ghcr.io
  CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release-chart:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # For keyless signing with cosign/Sigstore
      packages: write
    outputs:
      release_asset_hashes: ${{ steps.provenance-subjects.outputs.hashes }}
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Validate release ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          EXPECTED_REF="refs/heads/${DEFAULT_BRANCH}"
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "::error::Manual chart releases must run from $EXPECTED_REF"
            exit 1
          fi

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_ID }}
          private-key: ${{ secrets.AUTOMATION_SECRET }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for version calculation
          token: ${{ steps.app-token.outputs.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true

      - name: Calculate next chart version
        id: version
        env:
          RETRY_TAG: ${{ inputs.retry_tag }}
        run: |
          set -euo pipefail

          if [ -n "$RETRY_TAG" ]; then
            if ! [[ "$RETRY_TAG" =~ ^chart-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Chart retry tag must use strict chart-vX.Y.Z semantic versioning"
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/$RETRY_TAG" >/dev/null; then
              echo "::error::Chart retry tag $RETRY_TAG does not exist"
              exit 1
            fi

            TAG_COMMIT=$(git rev-parse "refs/tags/$RETRY_TAG^{commit}")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "::error::Chart retry tag $RETRY_TAG does not point to the checked-out commit"
              exit 1
            fi

            NEW_VERSION="${RETRY_TAG#chart-v}"
            echo "Retrying chart version: $NEW_VERSION"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$RETRY_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get the latest chart tag
          LATEST_CHART_TAG=$(git tag -l 'chart-v*' --sort=-v:refname \
            | grep -E '^chart-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | head -n1 || true)

          if [ -z "$LATEST_CHART_TAG" ]; then
            echo "No previous chart tag found, starting at 0.1.0"
            CURRENT_VERSION="0.0.0"
            COMMIT_RANGE="HEAD"
          else
            if ! git merge-base --is-ancestor "refs/tags/$LATEST_CHART_TAG" HEAD; then
              echo "::error::Latest chart tag $LATEST_CHART_TAG is not an ancestor of HEAD"
              exit 1
            fi
            CURRENT_VERSION="${LATEST_CHART_TAG#chart-v}"
            COMMIT_RANGE="refs/tags/${LATEST_CHART_TAG}..HEAD"
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Analyzing commits in range: $COMMIT_RANGE"

          # Parse current version
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          # Analyze commits for version bump type
          BUMP_TYPE="patch"

          # Check for breaking changes (BREAKING CHANGE in body or ! after type)
          if git log "$COMMIT_RANGE" --pretty=format:"%B" | grep -qE "(^BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!:)"; then
            BUMP_TYPE="major"
          # Check for features
          elif git log "$COMMIT_RANGE" --pretty=format:"%s" | grep -qE "^feat(\([^)]*\))?:"; then
            BUMP_TYPE="minor"
          fi

          echo "Bump type: $BUMP_TYPE"

          # Calculate new version
          case "$BUMP_TYPE" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
          esac

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=chart-v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get app version
        id: app_version
        env:
          INPUT_APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_APP_VERSION" ]; then
            APP_VERSION="$INPUT_APP_VERSION"
            if ! [[ "$APP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::App version must be a strict numeric semantic version"
              exit 1
            fi
            APP_TAG="v$APP_VERSION"
            if ! git rev-parse --verify --quiet "refs/tags/$APP_TAG" >/dev/null; then
              echo "::error::App version tag $APP_TAG does not exist"
              exit 1
            fi
            if ! git merge-base --is-ancestor "refs/tags/$APP_TAG" HEAD; then
              echo "::error::App version tag $APP_TAG is not an ancestor of HEAD"
              exit 1
            fi
          else
            # Get latest app version tag
            LATEST_APP_TAG=$(git tag -l 'v*' --sort=-v:refname \
              | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | head -n1 || true)
            if [ -z "$LATEST_APP_TAG" ]; then
              echo "::warning::No app version tag (v*) found. Using 0.1.0 as initial appVersion."
              APP_VERSION="0.1.0"
            else
              if ! git merge-base --is-ancestor "refs/tags/$LATEST_APP_TAG" HEAD; then
                echo "::error::Latest app tag $LATEST_APP_TAG is not an ancestor of HEAD"
                exit 1
              fi
              APP_VERSION="${LATEST_APP_TAG#v}"
            fi
          fi
          if ! [[ "$APP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::App version must be a strict numeric semantic version"
            exit 1
          fi
          echo "App version: $APP_VERSION"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate application release
        env:
          APP_TAG: v${{ steps.app_version.outputs.app_version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! RELEASE_DRAFT=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$APP_TAG" \
            --jq '.draft' 2>&1); then
            echo "::error::Published application release $APP_TAG was not found"
            echo "$RELEASE_DRAFT"
            exit 1
          fi
          if [ "$RELEASE_DRAFT" != "false" ]; then
            echo "::error::Application release $APP_TAG is not published"
            exit 1
          fi

      - name: Validate retry release state
        if: inputs.retry_tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RETRY_TAG: ${{ inputs.retry_tag }}
        run: |
          if RELEASE_DRAFT=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RETRY_TAG" \
            --jq '.draft' 2>&1); then
            if [ "$RELEASE_DRAFT" != "true" ]; then
              echo "::error::Chart release $RETRY_TAG is already published and cannot be retried"
              exit 1
            fi
          elif [[ "$RELEASE_DRAFT" != *"(HTTP 404)"* ]]; then
            echo "::error::Unable to verify release state for $RETRY_TAG"
            echo "$RELEASE_DRAFT"
            exit 1
          fi

      - name: Check if release needed
        id: check
        env:
          RETRY_TAG: ${{ inputs.retry_tag }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if [ -n "$RETRY_TAG" ]; then
            echo "Retry requested for existing tag $TAG"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists, skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Chart.yaml versions
        if: steps.check.outputs.skip != 'true'
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          APP_VERSION="${{ steps.app_version.outputs.app_version }}"

          echo "Setting chart version to: $CHART_VERSION"
          echo "Setting app version to: $APP_VERSION"

          sed -i "s/^version: 0.0.0-placeholder$/version: ${CHART_VERSION}/" "${{ env.CHART_DIR }}/Chart.yaml"
          sed -i "s/^appVersion: 0.0.0-placeholder$/appVersion: ${APP_VERSION}/" "${{ env.CHART_DIR }}/Chart.yaml"

          echo "Updated Chart.yaml:"
          cat "${{ env.CHART_DIR }}/Chart.yaml"

      - name: Lint chart
        if: steps.check.outputs.skip != 'true'
        run: helm lint "${{ env.CHART_DIR }}"

      - name: Package chart
        if: steps.check.outputs.skip != 'true'
        run: |
          helm package "${{ env.CHART_DIR }}" --destination .
          ls -la -- ./*.tgz

      - name: Sign chart package
        if: steps.check.outputs.skip != 'true'
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          cosign sign-blob --yes \
            --bundle "stampbot-${CHART_VERSION}.tgz.sigstore.json" \
            "stampbot-${CHART_VERSION}.tgz"

      - name: Generate SLSA provenance subjects
        id: provenance-subjects
        if: steps.check.outputs.skip != 'true'
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          echo "hashes=$(sha256sum "stampbot-${CHART_VERSION}.tgz" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to OCI registry
        if: steps.check.outputs.skip != 'true'
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          helm push "stampbot-${CHART_VERSION}.tgz" "oci://${{ env.CHART_REPO }}"

      - name: Create Git tag
        if: steps.check.outputs.skip != 'true' && inputs.retry_tag == ''
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Generate changelog
        if: steps.check.outputs.skip != 'true'
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="${{ steps.app_version.outputs.app_version }}"
          LATEST_CHART_TAG=$(git tag -l 'chart-v*' --sort=-v:refname | head -n2 | tail -n1)
          if [ -z "$LATEST_CHART_TAG" ] || [ "$LATEST_CHART_TAG" = "${{ steps.version.outputs.tag }}" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="refs/tags/${LATEST_CHART_TAG}..HEAD"
          fi

          # Write the changelog through one redirection so a partial command cannot
          # accidentally append to a stale file from an earlier step.
          {
            echo "## Container Version"
            echo ""
            echo "This chart deploys **stampbot v${APP_VERSION}**"
            echo ""
            echo "- Container image: \`ghcr.io/${{ github.repository }}:${APP_VERSION}\`"
            echo "- [View container release](https://github.com/${{ github.repository }}/releases/tag/v${APP_VERSION})"
            echo ""

            # Include the app changelog from its GitHub Release
            APP_CHANGELOG=$(gh release view "v${APP_VERSION}" --json body --jq '.body' 2>/dev/null || true)
            if [ -n "$APP_CHANGELOG" ]; then
              echo "## App Changelog"
              echo ""
              echo "$APP_CHANGELOG"
              echo ""
            fi

            echo "## Chart Changes"
            echo ""

            # Group commits by type
            FOUND_COMMITS=false
            for type in feat fix docs chore refactor test ci; do
              COMMITS=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --grep="^${type}:" --grep="^${type}(" -E 2>/dev/null || true)
              if [ -n "$COMMITS" ]; then
                FOUND_COMMITS=true
                case $type in
                  feat) echo "### 🚀 Features" ;;
                  fix) echo "### 🐛 Bug Fixes" ;;
                  docs) echo "### 📚 Documentation" ;;
                  chore) echo "### 🔧 Maintenance" ;;
                  refactor) echo "### ♻️ Refactoring" ;;
                  test) echo "### 🧪 Tests" ;;
                  ci) echo "### 🏗️ CI/CD" ;;
                esac
                echo "$COMMITS"
                echo ""
              fi
            done

            if [ "$FOUND_COMMITS" = false ]; then
              echo "- Chart updated for stampbot v${APP_VERSION}"
              echo ""
            fi

            echo ""
            if [ -n "$LATEST_CHART_TAG" ] && [ "$LATEST_CHART_TAG" != "${{ steps.version.outputs.tag }}" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_CHART_TAG}...${{ steps.version.outputs.tag }}"
            fi
          } > changelog.md

          cat changelog.md

      - name: Create draft GitHub Release
        id: create-release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Helm Chart ${{ steps.version.outputs.version }}"
          draft: true
          fail_on_unmatched_files: true
          body_path: changelog.md
          files: |
            stampbot-${{ steps.version.outputs.version }}.tgz
            stampbot-${{ steps.version.outputs.version }}.tgz.sigstore.json
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-chart-provenance:
    name: Generate Chart Release SLSA Provenance
    needs: release-chart
    if: needs.release-chart.outputs.skip != 'true'
    permissions:
      actions: read  # For reusable workflow path detection
      # The pinned SLSA generator declares a nested contents:write job even
      # when upload-assets is false. GitHub validates that declaration before
      # evaluating the nested job condition, so the caller must allow it.
      contents: write
      id-token: write  # For keyless SLSA provenance signing
    # SLSA generator workflows must use a full semantic tag for slsa-verifier compatibility.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release-chart.outputs.release_asset_hashes }}
      provenance-name: stampbot-chart-${{ needs.release-chart.outputs.version }}.intoto.jsonl
      # Finalization below attaches this known artifact to the captured
      # numeric draft. The generator must not search for a draft by tag.
      upload-assets: false

  publish-chart-release:
    name: Publish Chart Release
    needs: [release-chart, release-chart-provenance]
    if: needs.release-chart.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_ID }}
          private-key: ${{ secrets.AUTOMATION_SECRET }}

      - name: Checkout release finalizer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the known provenance artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stampbot-chart-${{ needs.release-chart.outputs.version }}.intoto.jsonl
          path: release-provenance

      - name: Verify assets and publish the exact release ID
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ID: ${{ needs.release-chart.outputs.release_id }}
          RELEASE_UPLOAD_URL: ${{ needs.release-chart.outputs.release_upload_url }}
          TAG: ${{ needs.release-chart.outputs.tag }}
          VERSION: ${{ needs.release-chart.outputs.version }}
        run: |
          set -euo pipefail
          python .github/scripts/finalize_release.py \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --upload-url "$RELEASE_UPLOAD_URL" \
            --tag "$TAG" \
            --provenance "release-provenance/stampbot-chart-${VERSION}.intoto.jsonl" \
            --expected-asset "stampbot-${VERSION}.tgz" \
            --expected-asset "stampbot-${VERSION}.tgz.sigstore.json" \
            --expected-asset "stampbot-chart-${VERSION}.intoto.jsonl"
