name: GitHub API Schema Check

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  schema-check:
    name: Validate manifest against live GitHub OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true

      - name: Set up Python package cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --only main,dev

      - name: Run live schema validation
        run: poetry run pytest -m live --no-cov -v
