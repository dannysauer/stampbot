name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    # Weekly on Sundays at 05:20 UTC.
    - cron: '20 5 * * 0'
  workflow_dispatch:

permissions: read-all

jobs:
  batch:
    name: Batch fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@82652fb49e77bc29c35da1167bb286e93c6bcc05 # v1
        with:
          language: python
          sanitizer: address

      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@82652fb49e77bc29c35da1167bb286e93c6bcc05 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 900
          mode: batch
          sanitizer: address
          output-sarif: true
          parallel-fuzzing: true
