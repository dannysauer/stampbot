name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please describe the feature you'd like.

  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: A clear description of the feature
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Why do you need this?
      description: What problem does this solve?
      placeholder: Describe your use case...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternatives you've tried
      placeholder: Current workaround or alternative approaches...
    validations:
      required: false
