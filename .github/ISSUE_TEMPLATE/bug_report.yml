name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: What should have happened instead?
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce this?
      description: Steps to reproduce (if applicable)
      placeholder: |
        1. Configure...
        2. Send webhook...
        3. See error...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Any error messages or logs (will be formatted as code)
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: Stampbot version or commit SHA
      placeholder: "v0.1.0 or abc1234"
    validations:
      required: false
