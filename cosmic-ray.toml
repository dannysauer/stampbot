# Cosmic Ray mutation testing configuration
# Docs: https://cosmic-ray.readthedocs.io/

[cosmic-ray]
module-path = "stampbot"
timeout = 30.0
excluded-modules = []
test-command = "python -m pytest tests/ -x -q --no-cov"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.cloning]
method = "copy"

# Use all default operators except bitwise-or replacements. This codebase uses
# `|` as a type-union operator, and annotation-only mutations do not change
# runtime behavior under the current test command.
[cosmic-ray.filters.operators-filter]
exclude-operators = [
    "core/ReplaceBinaryOperator_BitOr_.*",
]

# Note: Lines can be excluded from mutation with:
# pragma: no mutate
