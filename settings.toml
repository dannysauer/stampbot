# Stampbot Configuration
# This file contains default settings for stampbot.
# Override these via environment variables (STAMPBOT_*) or .secrets.toml

# Application name
app_name = "stampbot"

# Server settings
host = "0.0.0.0"
port = 8000
log_level = "INFO"
log_format = "auto"  # "json", "console", or "auto" (auto-detect K8s)

# Header used to determine the real client IP when running behind a reverse
# proxy or ingress controller.  Both ingress-nginx and traefik set this header
# by default.  Set to "" to disable and always use the direct connection address.
client_ip_header = "X-Forwarded-For"

# OpenTelemetry settings
otel_enabled = false
otel_service_name = "stampbot"
otel_insecure = false
# otel_endpoint = ""  # Set via env var or .secrets.toml

# Repository policy (stampbot.toml) is cached in memory per installation,
# repository, and default branch for this many seconds. A policy edit takes
# effect after the cache entry expires. Set to 0 to read policy on every event.
repo_config_cache_seconds = 300

# Metrics use a separate listener so the public webhook port never serves them.
# Enable this listener explicitly and choose a non-loopback host only when the
# surrounding network limits who can connect.
metrics_enabled = false
metrics_host = "127.0.0.1"
metrics_port = 9090

# Setup mode settings
setup_enabled = false
# Reopening setup after credentials are configured requires this second,
# deliberate opt-in. Leave it false during normal operation.
setup_allow_configured = false
# base_url = ""  # Required when setup is enabled (e.g., https://stampbot.example.com)

# GitHub App credentials (required for operation, set via env vars or .secrets.toml)
# app_id = 12345
# private_key = "..."
# webhook_secret = "..."

# Default repo configuration
# These defaults apply to all repos unless overridden in their stampbot.toml
[defaults]
approval_labels = ["autoapprove", "stamp"]
auto_approve_on_label = true
reapprove = false
chatops_enabled = true
chatops_required_permission = "maintain"
approve_commands = ["approve", "stamp"]
unapprove_commands = ["unapprove", "unstamp"]
required_labels = []
required_title_patterns = []
allowed_users = []
allowed_teams = []
